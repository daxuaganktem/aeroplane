<!doctype html>
<meta charset="utf-8">
<title>Skyline Glide icon</title>
<!-- Draws the app icon. tools/make-icons.mjs screenshots it at each size.
     ?size=512&pad=0.1 sets the canvas size and the safe-area padding (for maskable icons). -->
<style>html, body { margin: 0; background: transparent; } canvas { display: block; }</style>
<canvas id="c"></canvas>
<script>
  const q = new URLSearchParams(location.search);
  const size = Number(q.get('size') || 512), pad = Number(q.get('pad') || 0), splash = q.get('splash') === '1';
  const W = splash ? Number(q.get('w') || size) : size, H = splash ? Number(q.get('h') || size) : size;
  const c = document.getElementById('c'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // sky
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8fcbe6'); g.addColorStop(1, '#e3f2f8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // content lives in a square "stage" inside the safe area
  const S = Math.min(W, H) * (1 - pad * 2), ox = (W - S) / 2, oy = (H - S) / 2;
  ctx.save(); ctx.translate(ox, oy); ctx.scale(S / 100, S / 100);

  // sun
  ctx.fillStyle = '#f4c24a'; ctx.beginPath(); ctx.arc(78, 22, 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#dca12a'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(78 + Math.cos(a) * 11.5, 22 + Math.sin(a) * 11.5); ctx.lineTo(78 + Math.cos(a) * 14.5, 22 + Math.sin(a) * 14.5); ctx.stroke(); }

  // cloud
  ctx.fillStyle = '#d6e5ee';
  for (const [x, y, r] of [[18, 32, 5], [24, 29, 7], [31, 32, 5]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillRect(13, 32, 23, 4);
  ctx.fillStyle = '#ffffff';
  for (const [x, y, r] of [[18, 31, 5], [24, 28, 7], [31, 31, 5]]) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillRect(13, 31, 23, 3);

  // skyline
  const towers = [[4, 66, 13], [18, 58, 12], [31, 72, 14], [46, 62, 11], [58, 70, 13], [72, 60, 12], [85, 68, 12]];
  for (const [x, top, w] of towers) {
    ctx.fillStyle = '#e2e5e8'; ctx.fillRect(x, top, w, 100 - top);
    ctx.fillStyle = '#c9ced4'; ctx.fillRect(x + w * 0.8, top, w * 0.2, 100 - top);
    ctx.fillStyle = '#9fb1c1';
    for (let yy = top + 3; yy < 96; yy += 4) for (let xx = x + 2; xx < x + w - 3; xx += 3) ctx.fillRect(xx, yy, 1.5, 2);
    ctx.fillStyle = '#9aa1a9'; ctx.fillRect(x - 0.6, top - 0.8, w + 1.2, 1.6);
  }
  ctx.fillStyle = '#ebe8df'; ctx.fillRect(0, 96, 100, 4);
  ctx.strokeStyle = '#535353'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(100, 96); ctx.stroke();

  // the airliner, same shapes as the game, climbing
  const P2 = (d) => new Path2D(d);
  const liv = '#2b3f93', dark = '#1f2d6a';
  const plane = {
    farWing: P2('M-3 -4.8 L-9 -8.6 L-5 -8.9 L4 -4.8 Z'),
    fin: P2('M-13 -5 C-18 -5.6 -22 -9.5 -24.5 -21 L-28.8 -21.5 L-28.6 -5 Z'),
    finEdge: P2('M-28.8 -21.5 L-26.9 -21.4 L-26.5 -5 L-28.6 -5 Z'),
    body: P2('M-29 -4.8 L19 -5 C25 -5 29 -2.5 30 1.5 C30 4 27 5.5 21 5.5 L-12 5.5 C-18 5.5 -24 2 -30.5 -2 Z'),
    cockpit: P2('M23.4 -3.4 L27.2 -2.5 L28.9 -0.5 L24 -0.7 Z'),
    tailplane: P2('M-20.5 -1.2 L-31.8 -4.4 L-32.6 -2.1 L-24 1.3 Z'),
    wing: P2('M8.5 3 L-7 11.8 L-12.3 11.8 L-2 3 Z'), wingTop: P2('M8.5 3 L-6.3 10.8 L-9.6 10.8 L0.6 3 Z'),
  };
  ctx.save();
  ctx.translate(48, 50); ctx.rotate(-0.26); ctx.scale(1.18, 1.18);
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#8e98a5'; ctx.lineWidth = 0.7;
  const part = (p, f) => { ctx.fillStyle = f; ctx.fill(p); ctx.stroke(p); };
  part(plane.farWing, '#eef2f6');
  part(plane.fin, liv); ctx.fillStyle = dark; ctx.fill(plane.finEdge);
  part(plane.body, '#ffffff');
  ctx.save(); ctx.clip(plane.body); ctx.fillStyle = '#dde3ea'; ctx.fillRect(-40, 1.8, 80, 20); ctx.fillStyle = liv; ctx.fillRect(-40, 3.9, 80, 20); ctx.restore();
  ctx.stroke(plane.body);
  ctx.fillStyle = '#4a5160'; for (let x = -13.2; x <= 16; x += 2.9) ctx.fillRect(x, -2.4, 1.5, 1.7);
  ctx.strokeStyle = liv; ctx.lineWidth = 0.6;
  for (const [x, y, w, h] of [[-17.8, -3.7, 2.6, 5.4], [17.6, -3.7, 2.6, 5.4]]) { ctx.beginPath(); ctx.roundRect(x, y, w, h, 0.8); ctx.stroke(); }
  ctx.strokeStyle = '#8e98a5'; ctx.lineWidth = 0.7;
  ctx.fillStyle = '#27324f'; ctx.fill(plane.cockpit);
  part(plane.tailplane, '#eef2f6');
  part(plane.wing, '#c3cad3'); ctx.fillStyle = '#eef2f6'; ctx.fill(plane.wingTop);
  ctx.beginPath(); ctx.roundRect(1, 6.6, 11, 4.6, 2.3); ctx.fillStyle = liv; ctx.fill(); ctx.stroke();
  ctx.restore();
  // contrail
  ctx.fillStyle = 'rgba(140,150,160,0.55)';
  for (let i = 1; i <= 6; i++) { ctx.beginPath(); ctx.arc(48 - 34 - i * 3.2, 50 + 12 + i * 0.9, 0.9, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();

  if (splash) {
    ctx.fillStyle = '#535353';
    ctx.font = `${Math.round(Math.min(W, H) * 0.045)}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.fillText('S K Y L I N E   G L I D E', W / 2, oy + S * 0.08);
  }
  document.title = 'ready';
</script>
