<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a8d6ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyline Glide">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<title>Skyline Glide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: one full-bleed canvas for the world, a DOM layer for HUD, fuel and the pilots board.
     Single deliberate look: Chrome-Dino greys that fade into a night palette as you fly. */
  :root {
    --sky: #f7f7f5;
    --bg: #e3f2f8;
    --ink: #535353;
    --warn: #d0503c;
    --gold: #d9a520;
    --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    display: flex;
    gap: 1.4em;
    font: clamp(10px, 2.6vw, 14px)/1 var(--pixel);
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #hi { opacity: 0.6; }
  #mute {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    left: calc(env(safe-area-inset-left, 0px) + 8px);
    width: 44px; height: 44px;
    display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 8px;
    background: transparent; color: var(--ink);
    opacity: 0.7; cursor: pointer;
  }
  #mute:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #fuel {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 16px);
    display: flex; align-items: center; gap: 8px;
    font: clamp(7px, 2vw, 9px)/1 var(--pixel);
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  #fuelBar { width: clamp(72px, 20vw, 140px); height: 12px; border: 2px solid var(--ink); padding: 1px; box-sizing: border-box; }
  #fuelFill { height: 100%; width: 100%; background: var(--ink); transform-origin: left center; }
  #fuel.low #fuelFill { background: var(--warn); }
  #fuel.low #fuelLabel { color: var(--warn); }
  #fuel.empty { animation: blink 0.4s steps(1) infinite; }
  /* Menus: stacked in portrait, two columns in landscape; the board list scrolls inside its card. */
  #overlay {
    position: fixed; inset: 0;
    box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 58px) calc(env(safe-area-inset-right, 0px) + 16px)
             calc(env(safe-area-inset-bottom, 0px) + 40px) calc(env(safe-area-inset-left, 0px) + 16px);
    display: grid;
    grid-template-columns: minmax(0, 400px);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "head" "left" "right";
    justify-content: center;
    align-content: start;
    gap: 12px;
    pointer-events: none;
  }
  @media (orientation: landscape) and (min-width: 600px) {
    #overlay {
      grid-template-columns: minmax(0, 340px) minmax(0, 360px);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "head head" "left right";
      column-gap: 16px;
    }
  }
  #ovHead { grid-area: head; display: grid; justify-items: center; gap: 8px; text-align: center; }
  #ovTitle { font: clamp(14px, 4.4vw, 24px)/1.3 var(--pixel); letter-spacing: 0.22em; text-wrap: balance; }
  #ovSub { font: clamp(8px, 2.3vw, 11px)/1.9 var(--pixel); letter-spacing: 0.12em; opacity: 0.8; animation: pulse 1.2s steps(2) infinite; }
  #hint { font: clamp(7px, 2vw, 9px)/1.9 var(--pixel); letter-spacing: 0.08em; opacity: 0.55; max-width: 34ch; }
  .card {
    pointer-events: auto;
    touch-action: pan-y;
    box-sizing: border-box;
    min-width: 0; min-height: 0; max-height: 100%;
    align-self: start;
    overflow-y: auto;
    background: var(--sky);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
    font: clamp(8px, 2.2vw, 10px)/1.6 var(--pixel);
    letter-spacing: 0.05em;
    text-align: left;
  }
  #left { grid-area: left; }
  #right { grid-area: right; overflow: hidden; }
  #hangar, #result { display: flex; flex-direction: column; gap: 10px; }
  .cardHead { display: flex; justify-content: space-between; gap: 8px; opacity: 0.7; }
  #preview { width: 100%; height: 88px; display: block; flex: none; }
  .picker { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
  .picker .arrow { min-height: 38px; padding: 0; font-size: 12px; }
  .pick { display: grid; justify-items: center; gap: 4px; text-align: center; }
  #pickName { font-size: 1.15em; }
  #pickStatus { opacity: 0.7; font-size: 0.85em; }
  #pickStatus.locked { color: var(--warn); opacity: 1; }
  .pips { display: flex; justify-content: center; gap: 6px; }
  .pips span { width: 8px; height: 8px; box-sizing: border-box; border: 2px solid var(--ink); }
  .pips span.on { background: var(--ink); }
  .pips span.locked { border-style: dotted; opacity: 0.6; }
  #unlockHint { opacity: 0.7; font-size: 0.9em; }
  #unlockMsg { color: var(--warn); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 30px; height: 30px; padding: 0;
    border: 2px solid var(--ink); border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 3px var(--sky);
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 3px; }
  .actions { display: flex; gap: 8px; }
  .actions .px { flex: 1; min-height: 42px; font-size: clamp(9px, 2.4vw, 12px); }
  .px.ghost { background: var(--sky); color: var(--ink); }
  .bigScore { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .bigScore strong { font: clamp(16px, 5vw, 24px)/1 var(--pixel); font-weight: normal; font-variant-numeric: tabular-nums; }
  #boardList {
    list-style: none; margin: 0; padding: 0;
    display: grid; align-content: start; gap: 2px;
    flex: 1 1 auto; min-height: 64px;
    overflow-y: auto;
    touch-action: pan-y;
    font-variant-numeric: tabular-nums;
  }
  #boardList li { display: grid; grid-template-columns: 2.4em 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 3px 4px; }
  #boardList li .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #boardList li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, transparent); }
  #boardList li.me { background: var(--ink); color: var(--sky); }
  #boardList li.none { display: block; opacity: 0.6; }
  #entry { display: grid; gap: 8px; }
  #entry label { color: var(--warn); }
  .row { display: flex; gap: 8px; }
  #nameIn {
    flex: 1; min-width: 0;
    font: 16px/1 var(--pixel);
    text-transform: uppercase;
    padding: 8px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--sky); color: var(--ink);
    user-select: text; -webkit-user-select: text;
  }
  .px {
    font: clamp(8px, 2.2vw, 10px)/1 var(--pixel);
    letter-spacing: 0.08em;
    padding: 10px 12px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--ink); color: var(--sky);
    cursor: pointer;
  }
  .px:disabled { opacity: 0.5; cursor: default; }
  #saved { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .link { font: inherit; letter-spacing: inherit; background: none; border: 0; padding: 4px 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
  #boardNote { opacity: 0.7; flex: none; }
  .card button:focus-visible, #nameIn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-height: 430px) {
    #overlay { gap: 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 50px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); }
    #ovHead { gap: 4px; }
    .card { padding: 8px 10px; gap: 7px; }
    #hangar, #result { gap: 7px; }
    #preview { height: 50px; }
    .picker .arrow { min-height: 32px; }
    .swatch { width: 26px; height: 26px; }
    .actions .px { min-height: 36px; }
  }

  /* tabs on the right-hand card: top 10, daily challenges, achievements */
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex: none; }
  .tab {
    font: inherit; letter-spacing: inherit;
    min-height: 34px; padding: 6px 2px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--sky); color: var(--ink);
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--sky); }
  .tab span { opacity: 0.75; }
  .pane { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
  #dailyList, #awardList {
    list-style: none; margin: 0; padding: 0;
    display: grid; align-content: start; gap: 10px;
    flex: 1 1 auto; min-height: 64px;
    overflow-y: auto; touch-action: pan-y;
  }
  #dailyList li { display: grid; gap: 6px; }
  .drow { display: flex; justify-content: space-between; gap: 10px; }
  .drow span:last-child { flex: none; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; box-sizing: border-box; border: 2px solid var(--ink); padding: 1px; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  #dailyList li.done .drow span:last-child { color: var(--warn); }
  #awardList li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: start; opacity: 0.5; }
  #awardList li.got { opacity: 1; }
  #awardList .box { width: 12px; height: 12px; margin-top: 2px; box-sizing: border-box; border: 2px solid var(--ink); }
  #awardList li.got .box { background: var(--gold); border-color: var(--gold); }
  #awardList .desc { opacity: 0.75; font-size: 0.9em; margin-top: 3px; }
  #toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 50px);
    transform: translateX(-50%);
    max-width: calc(100vw - 32px); box-sizing: border-box;
    padding: 8px 12px;
    background: var(--sky); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 4px;
    font: clamp(8px, 2.2vw, 10px)/1.6 var(--pixel); letter-spacing: 0.06em;
    text-align: center; text-wrap: balance;
    pointer-events: none; z-index: 5;
  }
  #toast.gold { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  #account {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 58px);
    max-width: 44vw;
    padding: 7px 10px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--sky); color: var(--ink);
    font: clamp(8px, 2.2vw, 10px)/1 var(--pixel); letter-spacing: 0.06em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  #account.on::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 7px; background: #3f9a5a; vertical-align: 0; }
  #account:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #accountModal {
    position: fixed; inset: 0; z-index: 6;
    display: grid; place-items: center;
    padding: 16px; box-sizing: border-box;
    background: rgba(20, 24, 32, 0.4);
  }
  #accountCard { width: min(100%, 380px); max-height: 100%; }
  #accountBody { display: grid; gap: 12px; }
  #accountBody p { margin: 0; line-height: 1.8; }
  #accountBody .small { opacity: 0.7; font-size: 0.9em; }
  #accountBody .err { color: var(--warn); }
  #accountBody .px { width: 100%; min-height: 42px; }
  .blink { animation: blink 0.25s steps(1) 4; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    #ovSub, .blink, #fuel.empty { animation: none; }
  }
</style>

<canvas id="game" aria-label="Skyline Glide: tap to climb, hold to keep climbing"></canvas>
<div id="hud"><span id="hi">HI 00000</span><span id="score">00000</span></div>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path id="cross" d="M17 9l5 6M22 9l-5 6" style="display:none"/>
  </svg>
</button>
<div id="toast" role="status" aria-live="polite" hidden></div>
<button id="account" type="button" hidden aria-haspopup="dialog">SIGN IN</button>
<div id="accountModal" hidden>
  <section class="card" id="accountCard" role="dialog" aria-modal="true" aria-labelledby="accountTitle">
    <div class="cardHead"><span id="accountTitle">PILOT ACCOUNT</span><button class="link" id="accountClose" type="button">CLOSE</button></div>
    <div id="accountBody"></div>
  </section>
</div>
<div id="fuel" hidden><span id="fuelLabel">FUEL</span><div id="fuelBar"><div id="fuelFill"></div></div></div>
<div id="overlay">
  <div id="ovHead">
    <div id="ovTitle">SKYLINE GLIDE</div>
    <div id="ovSub">TAP ANYWHERE TO FLY · HOLD TO CLIMB</div>
    <div id="hint" hidden>Turn your phone sideways to see further ahead</div>
  </div>
  <section id="left" class="card" aria-label="Your plane">
    <div id="hangar">
      <div class="cardHead"><span>HANGAR</span><span id="planeName">AIRLINER</span></div>
      <canvas id="preview" aria-hidden="true"></canvas>
      <div class="picker" role="group" aria-label="Plane type">
        <button type="button" class="px ghost arrow" id="prevPlane" aria-label="Previous plane">&lt;</button>
        <div class="pick" aria-live="polite"><span id="pickName">AIRLINER</span><span id="pickStatus"></span></div>
        <button type="button" class="px ghost arrow" id="nextPlane" aria-label="Next plane">&gt;</button>
      </div>
      <div class="pips" id="pips" aria-hidden="true"></div>
      <div id="unlockHint"></div>
      <div class="swatches" id="swatches" role="group" aria-label="Livery colour"></div>
    </div>
    <div id="result" hidden>
      <div class="bigScore"><span>SCORE</span><strong id="finalScore">00000</strong></div>
      <div id="unlockMsg" hidden></div>
      <form id="entry" hidden>
        <label for="nameIn" id="entryLabel">NEW BEST! ENTER YOUR NAME</label>
        <div class="row">
          <input id="nameIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" placeholder="ACE">
          <button class="px" id="saveBtn" type="submit">SAVE</button>
        </div>
      </form>
      <div id="saved" hidden><span id="savedText"></span><button class="link" id="editName" type="button">EDIT NAME</button></div>
    </div>
    <div class="actions">
      <button class="px ghost" id="homeBtn" type="button" hidden>HOME</button>
      <button class="px" id="flyBtn" type="button">FLY</button>
    </div>
  </section>
  <section id="right" class="card" aria-label="Top pilots, daily challenges and achievements">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tab-board" aria-controls="pane-board" aria-selected="true">TOP 10</button>
      <button type="button" class="tab" role="tab" id="tab-daily" aria-controls="pane-daily" aria-selected="false">DAILY <span id="dailyCount"></span></button>
      <button type="button" class="tab" role="tab" id="tab-awards" aria-controls="pane-awards" aria-selected="false">AWARDS <span id="awardCount"></span></button>
    </div>
    <div class="pane" id="pane-board" role="tabpanel" aria-labelledby="tab-board">
      <div class="cardHead"><span>ALL-TIME PILOTS</span><span id="boardScope">THIS DEVICE</span></div>
      <ol id="boardList"></ol>
      <div id="boardNote" hidden></div>
    </div>
    <div class="pane" id="pane-daily" role="tabpanel" aria-labelledby="tab-daily" hidden>
      <div class="cardHead"><span>TODAY'S CHALLENGES</span><span id="dailyReset"></span></div>
      <ol id="dailyList"></ol>
    </div>
    <div class="pane" id="pane-awards" role="tabpanel" aria-labelledby="tab-awards" hidden>
      <div class="cardHead"><span>ACHIEVEMENTS</span><span id="awardsTotal"></span></div>
      <ol id="awardList"></ol>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  // Optional: a free Supabase project makes the board global when this file is hosted
  // outside claude.ai (see README). Leave empty to use claude.ai's shared store or this device.
  // The publishable key is meant to be public; the table's row-level security rules protect the data.
  const SUPABASE_URL = 'https://nsymcgtlbelmtshkbsok.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_iWAvFavSpjydq7c_4CFV9A_pI6rrNH8';

  const $ = (id) => document.getElementById(id);
  const cv = $('game');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx; // swapped briefly to draw the hangar preview
  const scoreEl = $('score'), hiEl = $('hi'), overlay = $('overlay'), ovTitle = $('ovTitle'),
        ovSub = $('ovSub'), hint = $('hint'), muteBtn = $('mute'),
        fuelEl = $('fuel'), fuelFill = $('fuelFill'), fuelLabel = $('fuelLabel');

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const pad = (n) => String(Math.min(n, 99999)).padStart(5, '0');
  function hash(a, b, c) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35) ^ Math.imul(c + 0x27d4eb2f, 0x165667b1);
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
    h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
    return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  // ---------- palette (day ↔ night) ----------
  // sky/skyTop: the sky gradient; panel: menu cards; t*: tower faces; tside: shaded side; tv: flickering screens
  const DAY = { sky: '#e3f2f8', skyTop: '#a8d6ea', panel: '#f7f7f5', ground: '#ebe8df', ink: '#535353', mid: '#8c96a0',
                t0: '#eceef0', t1: '#e2e5e8', t2: '#d8dce0', tside: '#c9ced4', trim: '#9aa1a9', lobby: '#8d949c',
                glass: '#cfe3ee', win: '#9fb1c1', lit: '#9fb1c1', tv: '#9fb1c1', glint: '#f4fbff',
                cloud: '#ffffff', cloudShade: '#d6e5ee', body: '#ffffff', wing: '#dcdcda', steel: '#a7aeb6' };
  const NIGHT = { sky: '#262b3a', skyTop: '#10131a', panel: '#1d2029', ground: '#1a1c22', ink: '#d4d4d2', mid: '#7a7f8b',
                  t0: '#2b2f38', t1: '#31353f', t2: '#262a32', tside: '#1f232a', trim: '#474d58', lobby: '#1a1d23',
                  glass: '#f2d27a', win: '#3b404b', lit: '#f2d27a', tv: '#8fb8ff', glint: '#3b404b',
                  cloud: '#3a3f4b', cloudShade: '#2c3039', body: '#ecebe7', wing: '#a9aab0', steel: '#8d949d' };
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const DAYc = {}, NIGHTc = {};
  for (const key in DAY) { DAYc[key] = hexRgb(DAY[key]); NIGHTc[key] = hexRgb(NIGHT[key]); }
  const P = {};
  let lastMix = -1;
  function updatePalette(m) {
    if (Math.abs(m - lastMix) < 0.002) return;
    lastMix = m;
    for (const key in DAYc) {
      const a = DAYc[key], b = NIGHTc[key];
      P[key] = `rgb(${Math.round(a[0] + (b[0] - a[0]) * m)},${Math.round(a[1] + (b[1] - a[1]) * m)},${Math.round(a[2] + (b[2] - a[2]) * m)})`;
    }
    const root = document.documentElement.style;
    root.setProperty('--sky', P.panel);
    root.setProperty('--bg', P.sky);
    root.setProperty('--ink', P.ink);
  }
  const SUN = '#f4c24a', SUN_LINE = '#dca12a', MOON = '#ebe6d2', FLAME = '#f39a2b', FLAME_CORE = '#ffe08a';

  // ---------- world sizing ----------

    const lw = 0.9 / sc;

  function segRect(x1, y1, x2, y2, r) {

  function makeCloud(x, near) {

    for (let i = 0; i < n; i++) {
      const f = i / (n - 1), arch = Math.sin(f * Math.PI);
      const r = (0.55 + arch * 0.75) * rand(8.5, 11);

  }

  // Keep each pilot's best only, highest first.
  function topPilots(rows) {
    const best = new Map();
    for (const r of rows) {
      const key = r.id || r.name;
      if (!key) continue;
      const prev = best.get(key);
      if (!prev || r.score > prev.score) best.set(key, r);

    return [...best.values()].sort((a, b) => b.score - a.score).slice(0, 10);

  // Supabase calls. Scores go through start_run / submit_score, which check each run on the server

  async function rpc(name, body) {
    await ensureFresh();

      method: 'POST',
      headers: sbHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body || {}),
    });
    if (!res.ok) {
      let reason = '';
      try { reason = (await res.json()).message || ''; } catch (e) { /* no body */ }

        headers: { apikey: SUPABASE_ANON_KEY },
      });

      Board.rows = topPilots((await res.json()).map((r) => ({ name: cleanName(r.name), score: cleanScore(r.score) })));

  async function initBoard() {

    if (!c || typeof c.use !== 'function') return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return; }
    if (!db) return;
    Board.db = db; Board.mode = 'db'; Board.rows = []; Board.best = 0; Board.note = '';
    try { Board.myId = user ? await user.id() : null; } catch (e) { Board.myId = null; }
    let canWrite = null;
    try { canWrite = user ? await user.can('data.write') : null; } catch (e) { canWrite = null; }
    if (!Board.myId || canWrite === false) {
      Board.readOnly = true;
      Board.note = 'You can see the global board, but only pilots the owner invites can post scores.';
    }
    renderBoard();
    db.collection('scores').orderBy('score', 'desc').limit(10).onSnapshot((snap) => {
      Board.rows = snap.docs.map((d) => {
        const v = d.data() || {};
        return { id: d.id, name: cleanName(v.name), score: cleanScore(v.score), color: colorById(v.color) ? v.color : '' };

    }, () => { Board.note = 'The global board stopped updating. Reload the page to reconnect.'; renderBoard(); });

  async function submitScore(name, value) {

  function checkAchievements() {

  // Three challenges a day, picked from the date so everyone gets the same three. They reset at local midnight.
  const dayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  function seeded(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };

    (r) => { const ty = oneOf(r, Object.keys(TYPE_PLURAL)), n = oneOf(r, [3, 4, 5]); return { text: `FLY PAST ${n} ${TYPE_PLURAL[ty]}`, target: n, metric: 'type:' + ty }; },

  // ---------- accounts: optional sign-in that saves progress to Supabase ----------
  // Google sign-in through Supabase Auth, handled with plain fetch calls. Only offered where the
  // Supabase board is in use (the GitHub Pages build), never inside claude.ai.
  // To offer GitHub too, enable it in Supabase and add { id: 'github', label: 'CONTINUE WITH GITHUB' }.
  const AUTH_PROVIDERS = [{ id: 'google', label: 'CONTINUE WITH GOOGLE' }];
  const SESSION_KEY = 'skyline-glide-session';
  const Auth = { session: null, user: null, lastSync: 0, syncing: false, error: '' };
  const accountBtn = $('account'), accountModal = $('accountModal'), accountBody = $('accountBody');

  // Signed in, requests carry the player's token; otherwise only the publishable key.
  function sbHeaders(extra) {

    return Object.assign(h, extra || {});

  async function authFetch(path, opts) {
    const o = opts || {};

    if (!res.ok) throw { status: res.status };

  }
  function saveSession(s) {

  }
  // Renew the player's token shortly before it expires. A refused renewal signs the player out on this device.
  async function ensureFresh() {
    const s = Auth.session;
    if (!s || s.expires_at - Date.now() / 1000 > 60) return;
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST', headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token }),

      if (res.status === 400 || res.status === 401) { signOutLocal('Your sign-in expired. Sign in again to keep saving progress.'); return; }
      if (!res.ok) return;

      return { access_token: h.get('access_token'), refresh_token: h.get('refresh_token'),
               expires_at: Number(h.get('expires_at')) || Date.now() / 1000 + Number(h.get('expires_in') || 3600) };
    }
    if (h.get('error')) Auth.error = `Sign-in didn't finish: ${h.get('error_description') || h.get('error')}.`;
    return null;
  }

  async function initAuth() {

      app.addListener('appUrlOpen', ({ url }) => {
        if (!String(url).startsWith(NATIVE_REDIRECT)) return;
        const browser = nativePlugin('Browser');
        if (browser) browser.close().catch(() => {});
        const s = sessionFromFragment(String(url).split('#')[1] || String(url).split('?')[1] || '');
        if (s) finishSignIn(s, true); else { renderAccount(); openAccount(); }
      });
    }
    let s = readRedirect();
    const fresh = !!s;
    if (!s) { try { s = JSON.parse(store.get(SESSION_KEY)); } catch (e) { s = null; } }
    if (!s || !s.access_token) { renderAccount(); if (Auth.error) openAccount(); return; }
    await finishSignIn(s, fresh);
  }
  async function finishSignIn(s, fresh) {
    saveSession(s);

      await ensureFresh();

      await pullProgress();

  function signIn(provider) {

    if (browser) browser.open({ url }).catch(() => { Auth.error = "Couldn't open the sign-in page."; renderAccount(); });

  // What gets saved to the account.
  function progressSnapshot() {
    const d = dailyToday();
    return { v: 1, stats, hi, best: Board.best, plane: choice.plane.id, color: choice.color.id,
             daily: { date: d.date, prog: d.prog, done: d.done } };
  }
  // Combine the account's progress with this device's: counters keep the higher value, achievements keep
  // the earliest date earned, today's challenges keep the furthest progress.
  function mergeProgress(cloud) {
    if (!cloud || typeof cloud !== 'object') return;
    const cs = cloud.stats || {}, num = (v) => (Number.isFinite(Number(v)) ? Math.max(0, Math.floor(Number(v))) : 0);
    for (const k of ['runs', 'total', 'nightfalls', 'sunrises', 'dailyDone', 'dailySweeps']) stats[k] = Math.max(stats[k] || 0, num(cs[k]));
    for (const id of Object.keys(LANDMARKS)) if (cs.landmarks && cs.landmarks[id]) stats.landmarks[id] = Math.max(stats.landmarks[id] || 0, num(cs.landmarks[id]));
    for (const tr of TRAFFIC) if (cs.types && cs.types[tr.id]) stats.types[tr.id] = Math.max(stats.types[tr.id] || 0, num(cs.types[tr.id]));
    for (const a of ACHIEVEMENTS) {
      const ts = cs.got && num(cs.got[a.id]);
      if (ts) stats.got[a.id] = stats.got[a.id] ? Math.min(stats.got[a.id], ts) : ts;
    }
    store.set('skyline-glide-stats', JSON.stringify(stats));
    const cHi = cleanScore(cloud.hi);
    if (cHi > hi) { hi = cHi; store.set('skyline-glide-hi', String(hi)); hiEl.textContent = 'HI ' + pad(hi); }
    const cBest = cleanScore(cloud.best);
    if (cBest > Board.best && Board.mode !== 'db') { Board.best = cBest; store.set('skyline-glide-saved', String(cBest)); }
    const d = dailyToday(), cd = cloud.daily;

      store.set('skyline-glide-daily', JSON.stringify({ date: d.date, prog: d.prog, done: d.done }));
    }

    if (plane && isUnlocked(plane)) { choice.plane = plane; viewIdx = PLANES.indexOf(plane); store.set('skyline-glide-plane', plane.id); }
    if (color) { choice.color = color; store.set('skyline-glide-color', color.id); }
  }
  async function pullProgress() {

    const row = rows && rows[0];

  // The account button and dialog.

  // ---------- game flow ----------
  function reset() {

    laserTimer = 2; speedTier = 0; tapLevel = 0;
    elapsed = 0; dist = 0; score = 0; lastMilestone = 0; lastHf = 0.35;
    speed = baseSpeed(); spawnCursor = W + 120; enemyTimer = 3.5;
    if (state !== 'ready') player.y = playH * 0.42;

  function flap() {

    homeBtn.hidden = true; flyBtn.textContent = 'FLY'; flyBtn.disabled = false;

  function showOver() {

  flyBtn.addEventListener('click', () => { if (state !== 'playing') launch(); });
  homeBtn.addEventListener('click', showHome);
  function crash() {
    state = 'over'; overT = 0;
    lastRun = currentRun; currentRun = null;
    sfx.crash();
    buzz(true);
    for (let i = 0; i < 12; i++) {
      const a = rand(0, TAU), v = rand(15, 60);
      puffs.push({ x: px + rand(-6, 16), y: player.y + rand(-6, 6), vx: Math.cos(a) * v, vy: Math.sin(a) * v - 10, r: rand(3, 7), life: 1 });
    }
    const before = bestEver();
    if (score > hi) { hi = score; store.set('skyline-glide-hi', String(hi)); }
    hiEl.textContent = 'HI ' + pad(hi);
    onRunEnd(score);
    queueSync(true);
    const fresh = PLANES.filter((p) => p.unlock > before && p.unlock <= score);
    const unlockMsg = $('unlockMsg');
    unlockMsg.hidden = !fresh.length;
    unlockMsg.textContent = fresh.length ? `UNLOCKED: ${fresh.map((p) => p.name).join(', ')}! PICK IT IN THE HANGAR.` : '';
    showOver();
  }

  function pickTraffic() {
    const open = TRAFFIC.filter((m) => score >= m.unlock && !m.special);
    return Math.random() < 0.55 ? pick(open.slice(-2)) : pick(open);
  }
  function trySpawnEnemy(diff) {
    const tr = pickTraffic(), m = CRAFT[tr.id];
    const sc = rand(tr.sc[0], tr.sc[1]);
    const v = rand(tr.v[0], tr.v[1] + 30 * diff);
    // Start far enough right that a warning shows for tr.warn seconds before it appears.
    const ex = W + 40 + (speed + v) * tr.warn;
    // The enemy moves left faster than the towers, so it only ever crosses towers already spawned left of it.
    let minTop = groundY;
    for (const c of clusters) {
      if (c.x < ex + 60 && c.x + c.width > -10) {
        for (const tw of c.towers) for (const r of towerRects(tw, c.x + tw.dx, towerTop(c, tw))) minTop = Math.min(minTop, r[1]);
      }
    }
    const yMin = 20 + m.top * sc + tr.wobble;
    const yMax = minTop - (70 + 10 * k) - m.bottom * sc - tr.wobble;
    if (yMax < yMin) { enemyTimer = 0.6; return; }
    const aim = Math.random() < (tr.track ? 0.8 : 0.5);
    const y = aim ? clamp(player.y + rand(-25, 25), yMin, yMax) : rand(yMin, yMax);
    for (const e of enemies) if (e.x > W * 0.45 && Math.abs(e.base - y) < 36) { enemyTimer = 0.5; return; }
    enemies.push({ x: ex, base: y, y, yMin, yMax, v, sc, tr, m, liv: pick(COLORS).c, seed: randi(1, 1e6) });
    enemyTimer = (rand(2.4, 4.2) - diff * 1.2) * tr.gap * trafficRate();
  }
  // Past 2000 more traffic comes, and more again for players who tap a lot.
  const tapPressure = () => tapLevel / TAP_LEVELS;
  const trafficRate = () => (1 - 0.35 * tapPressure()) * (score >= 2000 ? 0.75 : 1);

  // The safe altitude band for something crossing the whole screen right now.
  function laneFor(m, sc) {
    let minTop = groundY;
    for (const c of clusters) {
      if (c.x < W + 60 && c.x + c.width > -90) {
        for (const tw of c.towers) for (const r of towerRects(tw, c.x + tw.dx, towerTop(c, tw))) minTop = Math.min(minTop, r[1]);
      }
    }
    return [20 + m.top * sc, minTop - (70 + 10 * k) - m.bottom * sc];
  }
  // Interceptors lock on first: a red laser follows your altitude, freezes, then the jet streaks along it.
  function tryLock() {
    if (locks.length) { laserTimer = 1; return; }
    const sc = rand(INTERCEPTOR.sc[0], INTERCEPTOR.sc[1]), m = CRAFT[INTERCEPTOR.id];
    const [yMin, yMax] = laneFor(m, sc);

    locks.push({ t: 0, y: clamp(player.y, yMin, yMax), sc, beep: 0 });

  const LOCK_TRACK = 1.0, LOCK_FIRE = 1.55;
  function updateLocks(dt) {
    for (const L of locks) {

      const aim = yMax < yMin ? player.y : clamp(player.y, yMin, yMax);
      if (L.t < LOCK_TRACK) L.y += clamp(aim - L.y, -260 * k * dt, 260 * k * dt);
      L.beep -= dt;
      if (L.beep <= 0) { L.beep = L.t < LOCK_TRACK ? 0.25 : 0.1; sfx.lockBeep(L.t >= LOCK_TRACK); }
      if (L.t >= LOCK_FIRE) {
        L.done = true;
        if (yMax < yMin) continue; // no clear line through the towers: the jet breaks off
        const y = clamp(L.y, yMin, yMax);
        enemies.push({ x: W + 40, prevX: W + 40, base: y, y, yMin: y, yMax: y, v: rand(INTERCEPTOR.v[0], INTERCEPTOR.v[1]),
                       sc: L.sc, tr: INTERCEPTOR, m, liv: '#c8402f', seed: 0, laser: true });
        sfx.whoosh(); buzz();
      }
    }
    locks = locks.filter((L) => !L.done);
  }


  function update(dt) {
    t += dt;
    updateToast(dt);
    nightMix += clamp(nightTarget - nightMix, -dt * 0.5, dt * 0.5);
    updatePalette(nightMix);
    const worldSpeed = state === 'playing' ? speed : state === 'ready' ? 60 : 0;

    for (const c of clouds) {
      c.x -= (worldSpeed * (c.near ? 0.22 : 0.1) + (c.near ? 6 : 3)) * dt;
      if (c.x < -130) Object.assign(c, makeCloud(W + rand(40, 220), c.near));
    }
    flockTimer -= dt;
    if (flockTimer <= 0) { flocks.push(makeFlock(W + 40)); flockTimer = rand(4, 9); }
    for (const f of flocks) f.x -= (worldSpeed * 0.3 + f.v) * dt;
    flocks = flocks.filter((f) => f.x > -90);
    groundOff += worldSpeed * dt;

    for (const p of puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += 14 * dt; p.life -= dt * 1.1; }
    puffs = puffs.filter((p) => p.life > 0);
    for (const s of trail) { s.x -= worldSpeed * dt; s.a -= dt * 1.6; }
    trail = trail.filter((s) => s.a > 0);

    if (state === 'ready') {
      player.y = playH * (portrait ? 0.7 : 0.42) + Math.sin(t * 2.4) * 5;
      player.angle = Math.cos(t * 2.4) * -0.05;
      return;
    }
    if (state === 'over') { overT += dt; return; }

    // playing
    elapsed += dt;
    const tl = Math.min(TAP_LEVELS, Math.floor((run ? run.taps : 0) / TAPS_PER_LEVEL));
    if (tl > tapLevel) { tapLevel = tl; toast('MORE TRAFFIC AHEAD'); }
    const diff = clamp(elapsed / 100 + tapPressure() * 0.3, 0, 1);
    const tier = speedTierAt(score);
    if (tier > speedTier) {
      speedTier = tier;
      toast(`SPEED UP · ${Math.round(speedGoalAt(score) / baseSpeed() * 100)}%`); sfx.levelUp();
    }
    // early on the speed builds up gently, then it steps up every 500 points
    const goal = Math.max(speedGoalAt(score), Math.min(baseSpeed() + elapsed * 3.2, speedGoalAt(score) + baseSpeed() * SPEED_GAIN * 0.6));
    speed += clamp(goal - speed, -60 * dt, 60 * dt);
    dist += speed * dt;
    score = Math.floor(dist * 0.055);
    progTimer -= dt;
    if (progTimer <= 0) { progTimer = 0.5; runProgress(); }

    const g = 980 * k;
    const thrusting = holding() && !fuelOut;
    if (thrusting) {
      player.vy = Math.max(player.vy + (g - 2100 * k) * dt, -320 * k);
      fuel -= FUEL.burn * dt;
      if (fuel <= 0) { fuel = 0; fuelOut = true; sfx.sputter(); onFuelOut(); }
    } else {
      player.vy = Math.min(player.vy + g * dt, 460 * k);
      fuel = Math.min(1, fuel + FUEL.regen * dt);
      if (fuelOut && fuel >= FUEL.relight) fuelOut = false;
    }
    player.y += player.vy * dt;
    if (player.y < 18) { player.y = 18; player.vy = Math.max(player.vy, 0); }
    const target = clamp(player.vy / (460 * k) * 0.5, -0.38, 0.5);
    player.angle += (target - player.angle) * Math.min(1, dt * 10);

    for (const c of clusters) c.x -= speed * dt;
    clusters = clusters.filter((c) => c.x + c.width > -20);
    for (const c of clusters) {
      if (!c.lm) continue;
      if (!c.announced && c.x < W - 30) { c.announced = true; toast(`LANDMARK · ${LANDMARKS[c.lm]}`); }
      if (!c.passed && c.x + c.width < px - 30) { c.passed = true; onLandmark(c.lm); }
    }
    spawnCursor -= speed * dt;
    // Towers are generated well past the right edge so oncoming traffic always knows what it will cross.
    while (spawnCursor < W + 800) {
      // scores accrue at 0.055 per unit of distance, so this is the score when the cluster reaches the plane
      const arrives = score + (spawnCursor - px) * 0.055;
      const due = run && GUARANTEED.find((g) => !run.forced[g.lm] && arrives >= g.at);
      if (due) run.forced[due.lm] = true;
      const c = due ? makeLandmark(spawnCursor, diff, due.lm)
        : sinceLandmark >= 4 && Math.random() < 0.2 ? makeLandmark(spawnCursor, diff) : makeCluster(spawnCursor, diff);
      sinceLandmark = c.lm ? 0 : sinceLandmark + 1;
      clusters.push(c);
      // wider gaps at high speed keep some reaction time; tapping a lot tightens them
      const roomy = Math.sqrt(Math.max(1, speed / (portrait ? 300 : 380)));
      spawnCursor += c.width + (rand(170, 290) - diff * 30) * (portrait ? 0.9 : 1) * roomy * (1 - 0.18 * tapPressure());
    }

    for (const e of enemies) {
      e.prevX = e.x;
      e.x -= (speed + e.v) * dt;
      // Aggressive models steer toward your altitude until they pass you, within their safe lane.
      if (e.tr.track && e.x > px + 20) e.base += clamp(player.y - e.base, -e.tr.track * dt, e.tr.track * dt);
      e.base = clamp(e.base, e.yMin, e.yMax);
      e.y = e.base + Math.sin(t * (e.tr.wobbleRate || 2.2) + e.seed) * e.tr.wobble;
    }
    for (const e of enemies) if (!e.passed && e.x < px - 40) { e.passed = true; onPass(e.tr.id); }
    enemies = enemies.filter((e) => e.x > -80);
    enemyTimer -= dt;
    if (enemyTimer <= 0 && elapsed > 3) trySpawnEnemy(diff);
    if (score >= INTERCEPTOR.unlock) { laserTimer -= dt; if (laserTimer <= 0) tryLock(); }
    updateLocks(dt);

    trailTimer -= dt;
    if (trailTimer <= 0 && !fuelOut) {
      trailTimer = 0.04;
      const c = Math.cos(player.angle), s = Math.sin(player.angle);
      trail.push({ x: px - c - 8 * s, y: player.y - s + 8 * c, a: 0.6 });
    }

    if (score >= lastMilestone + 100) { lastMilestone = Math.floor(score / 100) * 100; blinkScore(); sfx.point(); }
    if (score >= nextToggle) { nightTarget = 1 - nightTarget; nextToggle += DAY_CYCLE; onDayChange(nightTarget === 1); }

    // collisions
    const sh = playerShape();
    const poly = modelPoly(sh, px, player.y, player.angle, 1, sh.sc);
    for (const p of poly) if (p[1] >= groundY) return crash();
    for (const c of clusters) {
      if (c.x > px + 50 || c.x + c.width < px - 50) continue;
      for (const tw of c.towers) for (const r of towerRects(tw, c.x + tw.dx, towerTop(c, tw))) if (polyHitsRect(poly, r)) return crash();
    }
    for (const e of enemies) {
      if (Math.abs(e.y - player.y) > 45) continue;
      const from = e.prevX == null ? e.x : e.prevX, steps = Math.max(1, Math.ceil((from - e.x) / 12));
      for (let i = 1; i <= steps; i++) {
        const x = from + (e.x - from) * i / steps;
        if (Math.abs(x - px) > 75) continue;
        if (polyHitsPoly(poly, modelPoly(e.m, x, e.y, 0, -1, e.sc))) return crash();
      }
    }
  }

  function drawLock(L) {
    const locked = L.t >= LOCK_TRACK, on = !locked || Math.sin(t * 40) > -0.3;
    ctx.save();
    ctx.strokeStyle = locked ? 'rgba(255,40,40,0.9)' : 'rgba(255,60,60,0.45)';
    ctx.lineWidth = locked ? 1.6 : 1;
    ctx.setLineDash(locked ? [] : [6, 5]); ctx.lineDashOffset = -t * 60;
    if (on) { ctx.beginPath(); ctx.moveTo(W, L.y); ctx.lineTo(0, L.y); ctx.stroke(); }
    ctx.setLineDash([]);
    // reticle closing in on your plane
    const r = locked ? 12 : 26 - 14 * (L.t / LOCK_TRACK);
    ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 1.6;
    if (on) {
      ctx.beginPath(); ctx.arc(px, L.y, r, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { ctx.moveTo(px + dx * (r - 4), L.y + dy * (r - 4)); ctx.lineTo(px + dx * (r + 5), L.y + dy * (r + 5)); }
      ctx.stroke();
    }
    // the jet's position marker at the right edge
    ctx.fillStyle = '#ff3b30';
    ctx.beginPath(); ctx.moveTo(W - 4, L.y - 8); ctx.lineTo(W - 18, L.y); ctx.lineTo(W - 4, L.y + 8); ctx.closePath(); ctx.fill();
    ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'right';
    if (on) ctx.fillText(locked ? 'LOCKED' : 'LOCK-ON', W - 22, L.y - 8);
    ctx.textAlign = 'left';
    ctx.restore();
  }

  function blinkScore() {
    scoreEl.classList.remove('blink');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('blink');
  }

  function renderFuel() {
    const f = Math.round(fuel * 100) / 100;
    if (f !== shownFuel) { shownFuel = f; fuelFill.style.transform = `scaleX(${f})`; }
    const st = fuelOut ? 'empty' : fuel < 0.3 ? 'low' : '';
    if (st !== shownFuelState) {
      shownFuelState = st;
      fuelEl.className = st === 'empty' ? 'low empty' : st;
      fuelLabel.textContent = fuelOut ? 'NO FUEL' : 'FUEL';
    }
  }

  function draw() {
    ctx.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, P.skyTop); sky.addColorStop(1, P.sky);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, groundY);

    if (nightMix > 0.01) {
      ctx.fillStyle = P.ink;
      for (const s of stars) {
        ctx.globalAlpha = nightMix * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
        ctx.fillRect(s.x * W, s.y * playH * 0.7, s.r, s.r);
      }
      ctx.globalAlpha = 1;
    }

    const sx = W * 0.8, sy = Math.max(42, playH * 0.17), sr = 17;
    if (nightMix < 0.99) {
      ctx.globalAlpha = 1 - nightMix;
      ctx.strokeStyle = SUN_LINE; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * TAU + t * 0.15;
        ctx.moveTo(sx + Math.cos(a) * (sr + 5), sy + Math.sin(a) * (sr + 5));
        ctx.lineTo(sx + Math.cos(a) * (sr + 10), sy + Math.sin(a) * (sr + 10));
      }
      ctx.stroke();
      ctx.fillStyle = SUN; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
      ctx.lineWidth = 1.4; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (nightMix > 0.01) {
      ctx.globalAlpha = nightMix;
      // crescent: the moon disc clipped away where a second disc overlaps it
      ctx.save();
      ctx.beginPath(); ctx.rect(sx - 30, sy - 30, 60, 60); ctx.arc(sx + 7, sy - 4, sr - 4, 0, TAU, true); ctx.clip();
      ctx.fillStyle = MOON; ctx.beginPath(); ctx.arc(sx, sy, sr - 2, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    for (const c of clouds) if (!c.near) drawCloud(c);
    for (const f of flocks) drawFlock(f);
    for (const c of clouds) if (c.near) drawCloud(c);

    for (const c of clusters) {
      if (c.x > W + 10 || c.x + c.width < -10) continue;
      for (const tw of c.towers) drawTower(tw, c.x + tw.dx, towerTop(c, tw));
    }

    for (const e of enemies) {
      if (e.x - 35 > W) {
        // incoming warning at the right edge
        if (Math.sin(t * 18) > -0.2) {
          ctx.fillStyle = '#d0503c';
          ctx.beginPath(); ctx.moveTo(W - 6, e.y - 7); ctx.lineTo(W - 16, e.y); ctx.lineTo(W - 6, e.y + 7); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(W - 15, e.y - 7); ctx.lineTo(W - 25, e.y); ctx.lineTo(W - 15, e.y + 7); ctx.closePath(); ctx.fill();
        }
        continue;
      }
      if (e.laser) {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        for (let i = 0; i < 3; i++) ctx.fillRect(e.x + 30 * e.sc, e.y - 5 + i * 5, 40 + i * 14, 1.2);
      }
      drawCraftAt(e.m, e.x, e.y, 0, -1, e.sc, e.liv, false);
    }
    for (const L of locks) drawLock(L);

    ctx.fillStyle = P.mid;
    for (const s of trail) { ctx.globalAlpha = s.a; ctx.fillRect(s.x - 1, s.y - 1, 2, 2); }
    ctx.globalAlpha = 1;
    drawCraftAt(playerShape(), px, player.y, player.angle, 1, playerShape().sc, choice.color.c, false);

    for (const p of puffs) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = P.body; ctx.strokeStyle = P.ink; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = P.ground; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = P.ink; ctx.lineWidth = 1.4; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.fillStyle = P.ink;
    for (let off = -(groundOff % GROUND_TILE); off < W; off += GROUND_TILE) {
      for (const p of pebbles) ctx.fillRect(off + p.x, groundY + p.y, p.w, 1.3);
      ctx.beginPath();
      for (const b of bumps) { ctx.moveTo(off + b.x, groundY); ctx.lineTo(off + b.x + 3, groundY - 2); ctx.lineTo(off + b.x + b.w - 3, groundY - 2); ctx.lineTo(off + b.x + b.w, groundY); }
      ctx.stroke();
    }

    if (score !== shownScore) { shownScore = score; scoreEl.textContent = pad(score); }
    if (state === 'playing') renderFuel();
  }

  // ---------- input ----------
  // Taps on the menu cards stay with the cards; a tap anywhere else flies.
  const isUi = (e) => e.target && e.target.closest && e.target.closest('#mute, .card, #account, #accountModal');
  window.addEventListener('pointerdown', (e) => {
    if (isUi(e)) return;
    e.preventDefault();
    if (document.activeElement === nameIn) nameIn.blur();
    pointers.add(e.pointerId);
    press();
  }, { passive: false });
  const release = (e) => pointers.delete(e.pointerId);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('touchstart', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
  window.addEventListener('contextmenu', (e) => { if (!isUi(e)) e.preventDefault(); });
  const isFlyKey = (e) => e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
  window.addEventListener('keydown', (e) => {
    if (!isFlyKey(e) || (e.target && e.target.closest && e.target.closest('input, button'))) return;
    e.preventDefault();
    if (!e.repeat) { keyHeld = true; press(); }
  });
  window.addEventListener('keyup', (e) => { if (isFlyKey(e)) keyHeld = false; });
  window.addEventListener('blur', () => { pointers.clear(); keyHeld = false; });
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    store.set('skyline-glide-muted', muted ? '1' : '0');
    renderMute();
    if (!muted) audio();
  });

  // ---------- loop ----------
  let last = performance.now();
  document.addEventListener('visibilitychange', () => { last = performance.now(); pointers.clear(); keyHeld = false; });
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    if (!overlay.hidden && !hangarEl.hidden) drawPreview();
    requestAnimationFrame(frame);
  }

  updatePalette(0);
  resize();
  initScenery();
  showHome();
  renderMute();
  hiEl.textContent = 'HI ' + pad(hi);
  window.addEventListener('resize', resize);
  initBoard();
  initAuth();
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
