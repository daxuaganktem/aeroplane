<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<title>Skyline Glide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: one full-bleed canvas for the world, a DOM layer for HUD, fuel and the pilots board.
     Single deliberate look: Chrome-Dino greys that fade into a night palette as you fly. */
  :root {
    --sky: #f7f7f5;
    --ink: #535353;
    --warn: #d0503c;
    --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--sky);
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    display: flex;
    gap: 1.4em;
    font: clamp(10px, 2.6vw, 14px)/1 var(--pixel);
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #hi { opacity: 0.6; }
  #mute {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    left: calc(env(safe-area-inset-left, 0px) + 8px);
    width: 44px; height: 44px;
    display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 8px;
    background: transparent; color: var(--ink);
    opacity: 0.7; cursor: pointer;
  }
  #mute:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #fuel {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 16px);
    display: flex; align-items: center; gap: 8px;
    font: clamp(7px, 2vw, 9px)/1 var(--pixel);
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  #fuelBar { width: clamp(72px, 20vw, 140px); height: 12px; border: 2px solid var(--ink); padding: 1px; box-sizing: border-box; }
  #fuelFill { height: 100%; width: 100%; background: var(--ink); transform-origin: left center; }
  #fuel.low #fuelFill { background: var(--warn); }
  #fuel.low #fuelLabel { color: var(--warn); }
  #fuel.empty { animation: blink 0.4s steps(1) infinite; }
  /* Menus: stacked in portrait, two columns in landscape; the board list scrolls inside its card. */
  #overlay {
    position: fixed; inset: 0;
    box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 58px) calc(env(safe-area-inset-right, 0px) + 16px)
             calc(env(safe-area-inset-bottom, 0px) + 40px) calc(env(safe-area-inset-left, 0px) + 16px);
    display: grid;
    grid-template-columns: minmax(0, 400px);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "head" "left" "right";
    justify-content: center;
    align-content: start;
    gap: 12px;
    pointer-events: none;
  }
  @media (orientation: landscape) and (min-width: 600px) {
    #overlay {
      grid-template-columns: minmax(0, 340px) minmax(0, 360px);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "head head" "left right";
      column-gap: 16px;
    }
  }
  #ovHead { grid-area: head; display: grid; justify-items: center; gap: 8px; text-align: center; }
  #ovTitle { font: clamp(14px, 4.4vw, 24px)/1.3 var(--pixel); letter-spacing: 0.22em; text-wrap: balance; }
  #ovSub { font: clamp(8px, 2.3vw, 11px)/1.9 var(--pixel); letter-spacing: 0.12em; opacity: 0.8; animation: pulse 1.2s steps(2) infinite; }
  #hint { font: clamp(7px, 2vw, 9px)/1.9 var(--pixel); letter-spacing: 0.08em; opacity: 0.55; max-width: 34ch; }
  .card {
    pointer-events: auto;
    touch-action: pan-y;
    box-sizing: border-box;
    min-width: 0; min-height: 0; max-height: 100%;
    align-self: start;
    overflow-y: auto;
    background: var(--sky);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
    font: clamp(8px, 2.2vw, 10px)/1.6 var(--pixel);
    letter-spacing: 0.05em;
    text-align: left;
  }
  #left { grid-area: left; }
  #right { grid-area: right; overflow: hidden; }
  #hangar, #result { display: flex; flex-direction: column; gap: 10px; }
  .cardHead { display: flex; justify-content: space-between; gap: 8px; opacity: 0.7; }
  #preview { width: 100%; height: 64px; display: block; flex: none; }
  .chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 330px) { .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .chip {
    font: clamp(7px, 2vw, 10px)/1.2 var(--pixel); letter-spacing: 0.02em;
    min-width: 0; min-height: 36px; padding: 6px 2px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--sky); color: var(--ink);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--sky); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 30px; height: 30px; padding: 0;
    border: 2px solid var(--ink); border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 3px var(--sky);
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 3px; }
  .actions { display: flex; gap: 8px; }
  .actions .px { flex: 1; min-height: 42px; font-size: clamp(9px, 2.4vw, 12px); }
  .px.ghost { background: var(--sky); color: var(--ink); }
  .bigScore { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .bigScore strong { font: clamp(16px, 5vw, 24px)/1 var(--pixel); font-weight: normal; font-variant-numeric: tabular-nums; }
  #boardList {
    list-style: none; margin: 0; padding: 0;
    display: grid; align-content: start; gap: 2px;
    flex: 1 1 auto; min-height: 64px;
    overflow-y: auto;
    touch-action: pan-y;
    font-variant-numeric: tabular-nums;
  }
  #boardList li { display: grid; grid-template-columns: 2.4em 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 3px 4px; }
  #boardList li .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #boardList li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, transparent); }
  #boardList li.me { background: var(--ink); color: var(--sky); }
  #boardList li.none { display: block; opacity: 0.6; }
  #entry { display: grid; gap: 8px; }
  #entry label { color: var(--warn); }
  .row { display: flex; gap: 8px; }
  #nameIn {
    flex: 1; min-width: 0;
    font: 16px/1 var(--pixel);
    text-transform: uppercase;
    padding: 8px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--sky); color: var(--ink);
    user-select: text; -webkit-user-select: text;
  }
  .px {
    font: clamp(8px, 2.2vw, 10px)/1 var(--pixel);
    letter-spacing: 0.08em;
    padding: 10px 12px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--ink); color: var(--sky);
    cursor: pointer;
  }
  .px:disabled { opacity: 0.5; cursor: default; }
  #saved { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .link { font: inherit; letter-spacing: inherit; background: none; border: 0; padding: 4px 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
  #boardNote { opacity: 0.7; flex: none; }
  .card button:focus-visible, #nameIn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-height: 430px) {
    #overlay { gap: 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 50px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); }
    #ovHead { gap: 4px; }
    .card { padding: 8px 10px; gap: 7px; }
    #hangar, #result { gap: 7px; }
    #preview { height: 44px; }
    .chip { min-height: 30px; }
    .swatch { width: 26px; height: 26px; }
    .actions .px { min-height: 36px; }
  }

  .blink { animation: blink 0.25s steps(1) 4; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    #ovSub, .blink, #fuel.empty { animation: none; }
  }
</style>

<canvas id="game" aria-label="Skyline Glide: tap to climb, hold to keep climbing"></canvas>
<div id="hud"><span id="hi">HI 00000</span><span id="score">00000</span></div>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path id="cross" d="M17 9l5 6M22 9l-5 6" style="display:none"/>
  </svg>
</button>
<div id="fuel" hidden><span id="fuelLabel">FUEL</span><div id="fuelBar"><div id="fuelFill"></div></div></div>
<div id="overlay">
  <div id="ovHead">
    <div id="ovTitle">SKYLINE GLIDE</div>
    <div id="ovSub">TAP ANYWHERE TO FLY · HOLD TO CLIMB</div>
    <div id="hint" hidden>Turn your phone sideways to see further ahead</div>
  </div>
  <section id="left" class="card" aria-label="Your plane">
    <div id="hangar">
      <div class="cardHead"><span>HANGAR</span><span id="planeName">AIRLINER</span></div>
      <canvas id="preview" aria-hidden="true"></canvas>
      <div class="chips" id="planeChips" role="group" aria-label="Plane type"></div>
      <div class="swatches" id="swatches" role="group" aria-label="Livery colour"></div>
    </div>
    <div id="result" hidden>
      <div class="bigScore"><span>SCORE</span><strong id="finalScore">00000</strong></div>
      <form id="entry" hidden>
        <label for="nameIn" id="entryLabel">NEW BEST! ENTER YOUR NAME</label>
        <div class="row">
          <input id="nameIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" placeholder="ACE">
          <button class="px" id="saveBtn" type="submit">SAVE</button>
        </div>
      </form>
      <div id="saved" hidden><span id="savedText"></span><button class="link" id="editName" type="button">EDIT NAME</button></div>
    </div>
    <div class="actions">
      <button class="px ghost" id="homeBtn" type="button" hidden>HOME</button>
      <button class="px" id="flyBtn" type="button">FLY</button>
    </div>
  </section>
  <section id="right" class="card" aria-label="Top pilots">
    <div class="cardHead"><span>TOP 10 PILOTS</span><span id="boardScope">THIS DEVICE</span></div>
    <ol id="boardList"></ol>
    <div id="boardNote" hidden></div>
  </section>
</div>

<script>
(() => {
  'use strict';

  // Optional: a free Supabase project makes the board global when this file is hosted
  // outside claude.ai (see README). Leave empty to use claude.ai's shared store or this device.
  const SUPABASE_URL = '';
  const SUPABASE_ANON_KEY = '';

  const $ = (id) => document.getElementById(id);
  const cv = $('game');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx; // swapped briefly to draw the hangar preview
  const scoreEl = $('score'), hiEl = $('hi'), overlay = $('overlay'), ovTitle = $('ovTitle'),
        ovSub = $('ovSub'), hint = $('hint'), muteBtn = $('mute'),
        fuelEl = $('fuel'), fuelFill = $('fuelFill'), fuelLabel = $('fuelLabel');

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const pad = (n) => String(Math.min(n, 99999)).padStart(5, '0');
  function hash(a, b, c) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35) ^ Math.imul(c + 0x27d4eb2f, 0x165667b1);
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
    h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
    return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  // ---------- palette (day ↔ night) ----------
  const DAY = { sky: '#f7f7f5', ink: '#535353', mid: '#9d9d9b', t0: '#efefed', t1: '#e6e6e4', t2: '#dddddb',
                win: '#c4c4c2', lit: '#c4c4c2', cloud: '#ffffff', cloudLine: '#c9c9c7', body: '#ffffff', wing: '#dcdcda',
                steel: '#a7aeb6' };
  const NIGHT = { sky: '#1d2029', ink: '#d4d4d2', mid: '#7a7f8b', t0: '#2b2f38', t1: '#31353f', t2: '#262a32',
                  win: '#3b404b', lit: '#f2d27a', cloud: '#3a3f4b', cloudLine: '#5a5f6b', body: '#ecebe7', wing: '#a9aab0',
                  steel: '#8d949d' };
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const DAYc = {}, NIGHTc = {};
  for (const key in DAY) { DAYc[key] = hexRgb(DAY[key]); NIGHTc[key] = hexRgb(NIGHT[key]); }
  const P = {};
  let lastMix = -1;
  function updatePalette(m) {
    if (Math.abs(m - lastMix) < 0.002) return;
    lastMix = m;
    for (const key in DAYc) {
      const a = DAYc[key], b = NIGHTc[key];
      P[key] = `rgb(${Math.round(a[0] + (b[0] - a[0]) * m)},${Math.round(a[1] + (b[1] - a[1]) * m)},${Math.round(a[2] + (b[2] - a[2]) * m)})`;
    }
    const root = document.documentElement.style;
    root.setProperty('--sky', P.sky);
    root.setProperty('--ink', P.ink);
  }
  const SUN = '#f4c24a', SUN_LINE = '#dca12a', MOON = '#ebe6d2', FLAME = '#f39a2b', FLAME_CORE = '#ffe08a';

  // ---------- world sizing ----------
  let cssW, cssH, dpr, S, W, H, groundY, playH, k, portrait, px;
  function resize() {
    cssW = window.innerWidth; cssH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    portrait = cssW < cssH * 0.9;
    S = portrait ? cssW / 360 : Math.min(cssH / 380, cssW / 560);
    W = cssW / S; H = cssH / S;
    groundY = H - (portrait ? Math.max(44, H * 0.1) : 34);
    playH = groundY;
    k = playH / 340;
    px = clamp(W * 0.2, 70, 150);
    hint.hidden = !(portrait && state === 'ready');
    player.y = clamp(player.y || playH * 0.42, 18, groundY - 14);
  }

  // ---------- state ----------
  let state = 'ready', t = 0, elapsed = 0, speed = 0, dist = 0, score = 0, shownScore = -1;
  let hi = parseInt(store.get('skyline-glide-hi'), 10) || 0;
  const DAY_CYCLE = 500;
  let lastMilestone = 0, nightMix = 0, nightTarget = 0, nextToggle = DAY_CYCLE;
  let clusters = [], enemies = [], clouds = [], flocks = [], puffs = [], trail = [], stars = [];
  let spawnCursor = 0, enemyTimer = 0, flockTimer = 3, groundOff = 0, trailTimer = 0, overT = 0, lastHf = 0.35;
  const player = { y: 0, vy: 0, angle: 0 };
  const pointers = new Set();
  let keyHeld = false;
  const holding = () => pointers.size > 0 || keyHeld;
  const baseSpeed = () => (portrait ? 150 : 175);

  // Fuel: taps sip, holding burns; it refills while you're off the throttle.
  const FUEL = { tap: 0.045, burn: 0.42, regen: 0.3, relight: 0.25 };
  let fuel = 1, fuelOut = false, shownFuel = -1, shownFuelState = '';

  // ---------- towers ----------
  const SHAPES = ['block', 'stepped', 'spire', 'antenna', 'dome', 'slant', 'crown', 'block'];
  const ornUnit = (hB) => Math.min(22, hB * 0.15);
  function makeCluster(x, diff) {
    const n = randi(2, 4);
    let hf = rand(0.2, 0.5 + 0.14 * diff);
    if (Math.abs(hf - lastHf) < 0.08) hf = clamp(hf + (hf > lastHf ? 0.1 : -0.1), 0.18, 0.64);
    lastHf = hf;
    const towers = [];
    let dx = 0;
    for (let i = 0; i < n; i++) {
      const w = randi(30, 54);
      towers.push({ dx, w, shape: pick(SHAPES), shade: randi(0, 2), o: rand(0.8, 1), seed: randi(1, 1e9), style: randi(0, 2) });
      dx += w + randi(0, 3);
    }
    return { x, hf, towers, width: dx };
  }

  function towerRects(tw, x, y0) {
    const w = tw.w, cx = x + w / 2, oH = ornUnit(groundY - y0) * tw.o;
    const r = [[x, y0, w, groundY - y0]];
    switch (tw.shape) {
      case 'block': r.push([x + w * 0.55, y0 - oH * 0.35, w * 0.28, oH * 0.35]); break;
      case 'stepped': r.push([x + w * 0.17, y0 - oH * 0.5, w * 0.66, oH * 0.5], [x + w * 0.32, y0 - oH, w * 0.36, oH * 0.5]); break;
      case 'spire': r.push([x + w * 0.3, y0 - oH * 0.4, w * 0.4, oH * 0.4], [cx - 2, y0 - oH * 1.5, 4, oH * 1.1]); break;
      case 'antenna': r.push([x + w * 0.35, y0 - 4, w * 0.3, 4], [cx - 2, y0 - oH * 1.6, 4, oH * 1.6]); break;
      case 'dome': { const rx = w * 0.38, ry = Math.min(oH, rx);
        r.push([cx - rx * 0.85, y0 - ry * 0.6, rx * 1.7, ry * 0.6], [cx - rx * 0.5, y0 - ry, rx, ry * 0.4]); break; }
      case 'slant': r.push([x, y0 - oH * 0.8, w * 0.3, oH * 0.8], [x, y0 - oH * 0.4, w * 0.65, oH * 0.4]); break;
      case 'crown': for (let m = 0; m < 3; m++) r.push([x + w * (0.08 + m * 0.32), y0 - oH * 0.4, w * 0.2, oH * 0.4]); break;
    }
    return r;
  }

  function drawTower(tw, x, y0) {
    const w = tw.w, cx = x + w / 2, hB = groundY - y0, oH = ornUnit(hB) * tw.o;
    const fill = P['t' + tw.shade];
    ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = P.ink; ctx.fillStyle = fill;

    ctx.beginPath();
    let beacon = null;
    switch (tw.shape) {
      case 'block': ctx.rect(x + w * 0.55, y0 - oH * 0.35, w * 0.28, oH * 0.35); break;
      case 'stepped': ctx.rect(x + w * 0.17, y0 - oH * 0.5, w * 0.66, oH * 0.5); ctx.rect(x + w * 0.32, y0 - oH, w * 0.36, oH * 0.5); break;
      case 'spire':
        ctx.moveTo(x + w * 0.2, y0); ctx.lineTo(cx, y0 - oH * 0.8); ctx.lineTo(x + w * 0.8, y0); ctx.closePath();
        break;
      case 'antenna': ctx.rect(x + w * 0.35, y0 - 4, w * 0.3, 4); beacon = [cx, y0 - oH * 1.6]; break;
      case 'dome': { const rx = w * 0.38, ry = Math.min(oH, rx);
        ctx.ellipse(cx, y0, rx, ry, 0, Math.PI, TAU); ctx.closePath(); break; }
      case 'slant': ctx.moveTo(x, y0); ctx.lineTo(x, y0 - oH * 0.8); ctx.lineTo(x + w, y0); ctx.closePath(); break;
      case 'crown': for (let m = 0; m < 3; m++) ctx.rect(x + w * (0.08 + m * 0.32), y0 - oH * 0.4, w * 0.2, oH * 0.4); break;
    }
    ctx.fill(); ctx.stroke();
    if (tw.shape === 'spire') { ctx.beginPath(); ctx.moveTo(cx, y0 - oH * 0.8); ctx.lineTo(cx, y0 - oH * 1.5); ctx.stroke(); }
    if (tw.shape === 'dome') { const ry = Math.min(oH, w * 0.38); ctx.beginPath(); ctx.moveTo(cx, y0 - ry); ctx.lineTo(cx, y0 - ry - 5); ctx.stroke(); }
    if (beacon) {
      ctx.beginPath(); ctx.moveTo(cx, y0 - 4); ctx.lineTo(cx, beacon[1]);
      ctx.moveTo(cx - 4, y0 - oH * 1.1); ctx.lineTo(cx + 4, y0 - oH * 1.1); ctx.stroke();
    }

    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.rect(x, y0, w, hB); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y0 + 3.5); ctx.lineTo(x + w, y0 + 3.5); ctx.lineWidth = 0.8; ctx.stroke();

    const night = nightMix > 0.02;
    for (let pass = 0; pass < (night ? 2 : 1); pass++) {
      ctx.fillStyle = pass ? P.lit : P.win;
      if (tw.style === 0) {
        const cols = Math.max(1, Math.floor((w - 8) / 7));
        const sx = x + (w - (cols * 7 - 3.5)) / 2;
        for (let r = 0, yy = y0 + 8; yy < groundY - 12; r++, yy += 8) {
          for (let c = 0; c < cols; c++) {
            if (hash(tw.seed, r, c) < 0.1) continue;
            const lit = night && hash(tw.seed, r, c + 97) < 0.5;
            if (lit !== !!pass) continue;
            ctx.fillRect(sx + c * 7, yy, 3.5, 4);
          }
        }
      } else if (tw.style === 1) {
        const segs = Math.max(1, Math.floor((w - 8) / 6));
        const sw = (w - 8) / segs;
        for (let r = 0, yy = y0 + 8; yy < groundY - 12; r++, yy += 9) {
          for (let c = 0; c < segs; c++) {
            const lit = night && hash(tw.seed, r, c + 31) < 0.45;
            if (lit !== !!pass) continue;
            ctx.fillRect(x + 4 + c * sw, yy, sw + 0.3, 3);
          }
        }
      } else {
        const cols = Math.max(1, Math.floor((w - 6) / 7));
        const sx = x + (w - (cols * 7 - 4)) / 2;
        for (let c = 0; c < cols; c++) {
          for (let r = 0, yy = y0 + 7; yy < groundY - 12; r++, yy += 9) {
            const lit = night && hash(tw.seed, r, c + 53) < 0.4;
            if (lit !== !!pass) continue;
            ctx.fillRect(sx + c * 7, yy, 4, Math.min(9, groundY - 12 - yy));
          }
        }
      }
    }
    ctx.fillStyle = P.win;
    ctx.fillRect(cx - 4, groundY - 8, 8, 8);
    if (beacon && Math.sin(t * 5 + tw.seed) > 0) {
      ctx.fillStyle = '#e0412f';
      ctx.beginPath(); ctx.arc(beacon[0], beacon[1], 1.8, 0, TAU); ctx.fill();
    }
  }

  // ---------- aircraft ----------
  // Every model is drawn facing right in local units (y down); oncoming traffic is mirrored.
  function navLights(tailX, tailY, tipX, tipY, seed) {
    if (nightMix > 0.3 && Math.sin(t * 6 + seed) > 0.3) {
      ctx.fillStyle = '#e0412f'; ctx.beginPath(); ctx.arc(tailX, tailY, 1.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5ee08a'; ctx.beginPath(); ctx.arc(tipX, tipY, 1.2, 0, TAU); ctx.fill();
    }

    ctx.save();

    ctx.restore();
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(x, y, 1.1, 0, TAU); ctx.fill();
  }

  function drawBiplane(liv, seed) {

  function modelPoly(m, x, y, ang, flip, sc) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return m.hit.map(([lx, ly]) => {
      const a = lx * flip * sc, b = ly * sc;
      return [x + a * c - b * s, y + a * s + b * c];
    });
  }
  function drawModel(m, x, y, ang, flip, sc, liv, seed) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang); ctx.scale(flip * sc, sc);
    ctx.lineWidth = 1.3 / sc; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = P.ink;
    m.draw(liv, seed);
    ctx.restore();
  }

  // ---------- collision helpers ----------
  function segRect(x1, y1, x2, y2, r) {

    for (let i = 0; i < n; i++) {
      const f = n === 1 ? 0.5 : i / (n - 1);

    ctx.beginPath();

  async function remoteFetch() {

        headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      });
      if (!res.ok) throw new Error(res.status);
      Board.rows = topPilots((await res.json()).map((r) => ({ name: cleanName(r.name), score: cleanScore(r.score) })));

  async function initBoard() {
    renderBoard();
    if (SUPABASE_URL && SUPABASE_ANON_KEY) { Board.mode = 'remote'; Board.rows = []; Board.note = ''; remoteFetch(); }
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    let db = null, user = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { return; }
    if (!db) return;
    Board.db = db; Board.mode = 'db'; Board.rows = []; Board.best = 0; Board.note = '';
    try { Board.myId = user ? await user.id() : null; } catch (e) { Board.myId = null; }
    let canWrite = null;
    try { canWrite = user ? await user.can('data.write') : null; } catch (e) { canWrite = null; }
    if (!Board.myId || canWrite === false) {
      Board.readOnly = true;
      Board.note = 'You can see the global board, but only pilots the owner invites can post scores.';
    }
    renderBoard();
    db.collection('scores').orderBy('score', 'desc').limit(10).onSnapshot((snap) => {
      Board.rows = snap.docs.map((d) => {
        const v = d.data() || {};
        return { id: d.id, name: cleanName(v.name), score: cleanScore(v.score), color: colorById(v.color) ? v.color : '' };
      });
      renderBoard();
    }, () => { Board.note = 'The global board stopped updating. Reload the page to reconnect.'; renderBoard(); });
    if (Board.myId) {
      try {
        const mine = await db.doc('scores/' + Board.myId).get();

          const v = mine.data() || {};

  function pickTraffic() {
    const open = TRAFFIC.filter((m) => score >= m.unlock);
    const newest = open[open.length - 1];

  }
  function trySpawnEnemy(diff) {
    const tr = pickTraffic(), m = MODELS[pick(tr.models)];
    const sc = rand(tr.sc[0], tr.sc[1]);
    const v = rand(tr.v[0], tr.v[1] + 30 * diff);
    // Start far enough right that a warning shows for tr.warn seconds before it appears.
    const ex = W + 40 + (speed + v) * tr.warn;
    // The enemy moves left faster than the towers, so it only ever crosses towers already spawned left of it.
    let minTop = groundY;
    for (const c of clusters) {
      if (c.x < ex + 60 && c.x + c.width > -10) {
        const hB = c.hf * playH;
        minTop = Math.min(minTop, groundY - hB - ornUnit(hB) * 1.6);
      }
    }
    const yMin = 20 + m.top * sc + tr.wobble;
    const yMax = minTop - (70 + 10 * k) - m.bottom * sc - tr.wobble;
    if (yMax < yMin) { enemyTimer = 0.6; return; }
    const aim = Math.random() < (tr.track ? 0.8 : 0.5);
    const y = aim ? clamp(player.y + rand(-25, 25), yMin, yMax) : rand(yMin, yMax);
    for (const e of enemies) if (e.x > W * 0.45 && Math.abs(e.base - y) < 36) { enemyTimer = 0.5; return; }
    enemies.push({ x: ex, base: y, y, yMin, yMax, v, sc, tr, m, liv: pick(tr.liveries), seed: randi(1, 1e6) });

  function update(dt) {
    t += dt;
    nightMix += clamp(nightTarget - nightMix, -dt * 0.5, dt * 0.5);
    updatePalette(nightMix);
    const worldSpeed = state === 'playing' ? speed : state === 'ready' ? 60 : 0;

    for (const c of clouds) {
      c.x -= (worldSpeed * (c.near ? 0.22 : 0.1) + (c.near ? 6 : 3)) * dt;
      if (c.x < -130) Object.assign(c, makeCloud(W + rand(40, 220), c.near));
    }
    flockTimer -= dt;
    if (flockTimer <= 0) { flocks.push(makeFlock(W + 40)); flockTimer = rand(4, 9); }
    for (const f of flocks) f.x -= (worldSpeed * 0.3 + f.v) * dt;
    flocks = flocks.filter((f) => f.x > -90);
    groundOff += worldSpeed * dt;

    for (const p of puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += 14 * dt; p.life -= dt * 1.1; }
    puffs = puffs.filter((p) => p.life > 0);
    for (const s of trail) { s.x -= worldSpeed * dt; s.a -= dt * 1.6; }
    trail = trail.filter((s) => s.a > 0);

    if (state === 'ready') {

    // playing
    elapsed += dt;
    const diff = clamp(elapsed / 100, 0, 1);
    speed = Math.min(baseSpeed() + elapsed * 3.2, portrait ? 300 : 380);
    dist += speed * dt;
    score = Math.floor(dist * 0.055);

    const g = 980 * k;
    const thrusting = holding() && !fuelOut;
    if (thrusting) {
      player.vy = Math.max(player.vy + (g - 2100 * k) * dt, -320 * k);
      fuel -= FUEL.burn * dt;
      if (fuel <= 0) { fuel = 0; fuelOut = true; sfx.sputter(); }
    } else {
      player.vy = Math.min(player.vy + g * dt, 460 * k);
      fuel = Math.min(1, fuel + FUEL.regen * dt);
      if (fuelOut && fuel >= FUEL.relight) fuelOut = false;
    }
    player.y += player.vy * dt;
    if (player.y < 18) { player.y = 18; player.vy = Math.max(player.vy, 0); }
    const target = clamp(player.vy / (460 * k) * 0.5, -0.38, 0.5);
    player.angle += (target - player.angle) * Math.min(1, dt * 10);

    for (const c of clusters) c.x -= speed * dt;
    clusters = clusters.filter((c) => c.x + c.width > -20);
    spawnCursor -= speed * dt;
    // Towers are generated well past the right edge so oncoming traffic always knows what it will cross.
    while (spawnCursor < W + 800) {
      const c = makeCluster(spawnCursor, diff);
      clusters.push(c);
      spawnCursor += c.width + (rand(170, 290) - diff * 30) * (portrait ? 0.9 : 1);
    }

    for (const e of enemies) {
      e.x -= (speed + e.v) * dt;
      // Aggressive models steer toward your altitude until they pass you, within their safe lane.
      if (e.tr.track && e.x > px + 20) e.base += clamp(player.y - e.base, -e.tr.track * dt, e.tr.track * dt);
      e.base = clamp(e.base, e.yMin, e.yMax);
      e.y = e.base + Math.sin(t * 2.2 + e.seed) * e.tr.wobble;
    }
    enemies = enemies.filter((e) => e.x > -80);
    enemyTimer -= dt;
    if (enemyTimer <= 0 && elapsed > 3) trySpawnEnemy(diff);

    trailTimer -= dt;
    if (trailTimer <= 0 && !fuelOut) {
      trailTimer = 0.04;
      const c = Math.cos(player.angle), s = Math.sin(player.angle);
      trail.push({ x: px - c - 8 * s, y: player.y - s + 8 * c, a: 0.6 });
    }

    if (score >= lastMilestone + 100) { lastMilestone = Math.floor(score / 100) * 100; blinkScore(); sfx.point(); }
    if (score >= nextToggle) { nightTarget = 1 - nightTarget; nextToggle += DAY_CYCLE; }

    // collisions
    const poly = modelPoly(playerModel(), px, player.y, player.angle, 1, choice.plane.sc);
    for (const p of poly) if (p[1] >= groundY) return crash();
    for (const c of clusters) {
      if (c.x > px + 40 || c.x + c.width < px - 40) continue;
      const y0 = groundY - c.hf * playH;
      for (const tw of c.towers) for (const r of towerRects(tw, c.x + tw.dx, y0)) if (polyHitsRect(poly, r)) return crash();
    }
    for (const e of enemies) {
      if (Math.abs(e.x - px) > 70 || Math.abs(e.y - player.y) > 45) continue;
      if (polyHitsPoly(poly, modelPoly(e.m, e.x, e.y, 0, -1, e.sc))) return crash();
    }
  }

  function blinkScore() {
    scoreEl.classList.remove('blink');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('blink');
  }

  function renderFuel() {
    const f = Math.round(fuel * 100) / 100;
    if (f !== shownFuel) { shownFuel = f; fuelFill.style.transform = `scaleX(${f})`; }
    const st = fuelOut ? 'empty' : fuel < 0.3 ? 'low' : '';
    if (st !== shownFuelState) {
      shownFuelState = st;
      fuelEl.className = st === 'empty' ? 'low empty' : st;
      fuelLabel.textContent = fuelOut ? 'NO FUEL' : 'FUEL';
    }
  }

  function draw() {
    ctx.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
    ctx.fillStyle = P.sky; ctx.fillRect(0, 0, W, H);

    if (nightMix > 0.01) {
      ctx.fillStyle = P.ink;
      for (const s of stars) {
        ctx.globalAlpha = nightMix * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
        ctx.fillRect(s.x * W, s.y * playH * 0.7, s.r, s.r);
      }
      ctx.globalAlpha = 1;
    }

    const sx = W * 0.8, sy = Math.max(42, playH * 0.17), sr = 17;
    if (nightMix < 0.99) {
      ctx.globalAlpha = 1 - nightMix;
      ctx.strokeStyle = SUN_LINE; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * TAU + t * 0.15;
        ctx.moveTo(sx + Math.cos(a) * (sr + 5), sy + Math.sin(a) * (sr + 5));
        ctx.lineTo(sx + Math.cos(a) * (sr + 10), sy + Math.sin(a) * (sr + 10));
      }
      ctx.stroke();
      ctx.fillStyle = SUN; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
      ctx.lineWidth = 1.4; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (nightMix > 0.01) {
      ctx.globalAlpha = nightMix;
      ctx.fillStyle = MOON; ctx.beginPath(); ctx.arc(sx, sy, sr - 2, 0, TAU); ctx.fill();
      ctx.fillStyle = P.sky; ctx.beginPath(); ctx.arc(sx + 7, sy - 4, sr - 4, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (const c of clouds) if (!c.near) drawCloud(c);
    for (const f of flocks) drawFlock(f);
    for (const c of clouds) if (c.near) drawCloud(c);

    for (const c of clusters) {
      if (c.x > W + 10 || c.x + c.width < -10) continue;
      const y0 = groundY - c.hf * playH;
      for (const tw of c.towers) drawTower(tw, c.x + tw.dx, y0);
    }

    for (const e of enemies) {
      if (e.x - 35 > W) {
        // incoming warning at the right edge
        if (Math.sin(t * 18) > -0.2) {
          ctx.fillStyle = '#d0503c';
          ctx.beginPath(); ctx.moveTo(W - 6, e.y - 7); ctx.lineTo(W - 16, e.y); ctx.lineTo(W - 6, e.y + 7); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(W - 15, e.y - 7); ctx.lineTo(W - 25, e.y); ctx.lineTo(W - 15, e.y + 7); ctx.closePath(); ctx.fill();
        }
        continue;
      }
      drawModel(e.m, e.x, e.y, 0, -1, e.sc, e.liv, e.seed);
    }

    ctx.fillStyle = P.mid;
    for (const s of trail) { ctx.globalAlpha = s.a; ctx.fillRect(s.x - 1, s.y - 1, 2, 2); }
    ctx.globalAlpha = 1;
    drawModel(playerModel(), px, player.y, player.angle, 1, choice.plane.sc, choice.color.c, 7);

    for (const p of puffs) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = P.body; ctx.strokeStyle = P.ink; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = P.sky; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = P.ink; ctx.lineWidth = 1.4; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.fillStyle = P.ink;
    for (let off = -(groundOff % GROUND_TILE); off < W; off += GROUND_TILE) {
      for (const p of pebbles) ctx.fillRect(off + p.x, groundY + p.y, p.w, 1.3);
      ctx.beginPath();
      for (const b of bumps) { ctx.moveTo(off + b.x, groundY); ctx.lineTo(off + b.x + 3, groundY - 2); ctx.lineTo(off + b.x + b.w - 3, groundY - 2); ctx.lineTo(off + b.x + b.w, groundY); }
      ctx.stroke();
    }

    if (score !== shownScore) { shownScore = score; scoreEl.textContent = pad(score); }
    if (state === 'playing') renderFuel();
  }

  // ---------- input ----------
  // Taps on the menu cards stay with the cards; a tap anywhere else flies.
  const isUi = (e) => e.target && e.target.closest && e.target.closest('#mute, .card');
  window.addEventListener('pointerdown', (e) => {
    if (isUi(e)) return;
    e.preventDefault();
    if (document.activeElement === nameIn) nameIn.blur();
    pointers.add(e.pointerId);
    press();
  }, { passive: false });
  const release = (e) => pointers.delete(e.pointerId);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('touchstart', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
  window.addEventListener('contextmenu', (e) => { if (!isUi(e)) e.preventDefault(); });
  const isFlyKey = (e) => e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
  window.addEventListener('keydown', (e) => {
    if (!isFlyKey(e) || (e.target && e.target.closest && e.target.closest('input, button'))) return;
    e.preventDefault();
    if (!e.repeat) { keyHeld = true; press(); }
  });
  window.addEventListener('keyup', (e) => { if (isFlyKey(e)) keyHeld = false; });
  window.addEventListener('blur', () => { pointers.clear(); keyHeld = false; });
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    store.set('skyline-glide-muted', muted ? '1' : '0');
    renderMute();
    if (!muted) audio();
  });

  // ---------- loop ----------
  let last = performance.now();
  document.addEventListener('visibilitychange', () => { last = performance.now(); pointers.clear(); keyHeld = false; });
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    if (!overlay.hidden && !hangarEl.hidden) drawPreview();
    requestAnimationFrame(frame);
  }

  updatePalette(0);
  resize();
  initScenery();
  showHome();
  renderMute();
  hiEl.textContent = 'HI ' + pad(hi);
  window.addEventListener('resize', resize);
  initBoard();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
