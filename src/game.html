<title>Skyline Glide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: one full-bleed canvas for the world, a DOM layer for HUD, fuel and the pilots board.
     Single deliberate look: Chrome-Dino greys that fade into a night palette as you fly. */
  :root {
    --sky: #f7f7f5;
    --bg: #e3f2f8;
    --ink: #535353;
    --warn: #d0503c;
    --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: calc(env(safe-area-inset-right, 0px) + 16px);
    display: flex;
    gap: 1.4em;
    font: clamp(10px, 2.6vw, 14px)/1 var(--pixel);
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  #hi { opacity: 0.6; }
  #mute {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    left: calc(env(safe-area-inset-left, 0px) + 8px);
    width: 44px; height: 44px;
    display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 8px;
    background: transparent; color: var(--ink);
    opacity: 0.7; cursor: pointer;
  }
  #mute:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #fuel {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    left: calc(env(safe-area-inset-left, 0px) + 16px);
    display: flex; align-items: center; gap: 8px;
    font: clamp(7px, 2vw, 9px)/1 var(--pixel);
    letter-spacing: 0.08em;
    pointer-events: none;
  }
  #fuelBar { width: clamp(72px, 20vw, 140px); height: 12px; border: 2px solid var(--ink); padding: 1px; box-sizing: border-box; }
  #fuelFill { height: 100%; width: 100%; background: var(--ink); transform-origin: left center; }
  #fuel.low #fuelFill { background: var(--warn); }
  #fuel.low #fuelLabel { color: var(--warn); }
  #fuel.empty { animation: blink 0.4s steps(1) infinite; }
  /* Menus: stacked in portrait, two columns in landscape; the board list scrolls inside its card. */
  #overlay {
    position: fixed; inset: 0;
    box-sizing: border-box;
    padding: calc(env(safe-area-inset-top, 0px) + 58px) calc(env(safe-area-inset-right, 0px) + 16px)
             calc(env(safe-area-inset-bottom, 0px) + 40px) calc(env(safe-area-inset-left, 0px) + 16px);
    display: grid;
    grid-template-columns: minmax(0, 400px);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "head" "left" "right";
    justify-content: center;
    align-content: start;
    gap: 12px;
    pointer-events: none;
  }
  @media (orientation: landscape) and (min-width: 600px) {
    #overlay {
      grid-template-columns: minmax(0, 340px) minmax(0, 360px);
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "head head" "left right";
      column-gap: 16px;
    }
  }
  #ovHead { grid-area: head; display: grid; justify-items: center; gap: 8px; text-align: center; }
  #ovTitle { font: clamp(14px, 4.4vw, 24px)/1.3 var(--pixel); letter-spacing: 0.22em; text-wrap: balance; }
  #ovSub { font: clamp(8px, 2.3vw, 11px)/1.9 var(--pixel); letter-spacing: 0.12em; opacity: 0.8; animation: pulse 1.2s steps(2) infinite; }
  #hint { font: clamp(7px, 2vw, 9px)/1.9 var(--pixel); letter-spacing: 0.08em; opacity: 0.55; max-width: 34ch; }
  .card {
    pointer-events: auto;
    touch-action: pan-y;
    box-sizing: border-box;
    min-width: 0; min-height: 0; max-height: 100%;
    align-self: start;
    overflow-y: auto;
    background: var(--sky);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
    font: clamp(8px, 2.2vw, 10px)/1.6 var(--pixel);
    letter-spacing: 0.05em;
    text-align: left;
  }
  #left { grid-area: left; }
  #right { grid-area: right; overflow: hidden; }
  #hangar, #result { display: flex; flex-direction: column; gap: 10px; }
  .cardHead { display: flex; justify-content: space-between; gap: 8px; opacity: 0.7; }
  #preview { width: 100%; height: 88px; display: block; flex: none; }
  .picker { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
  .picker .arrow { min-height: 38px; padding: 0; font-size: 12px; }
  .pick { display: grid; justify-items: center; gap: 4px; text-align: center; }
  #pickName { font-size: 1.15em; }
  #pickStatus { opacity: 0.7; font-size: 0.85em; }
  #pickStatus.locked { color: var(--warn); opacity: 1; }
  .pips { display: flex; justify-content: center; gap: 6px; }
  .pips span { width: 8px; height: 8px; box-sizing: border-box; border: 2px solid var(--ink); }
  .pips span.on { background: var(--ink); }
  .pips span.locked { border-style: dotted; opacity: 0.6; }
  #unlockHint { opacity: 0.7; font-size: 0.9em; }
  #unlockMsg { color: var(--warn); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatch {
    width: 30px; height: 30px; padding: 0;
    border: 2px solid var(--ink); border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 3px var(--sky);
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 3px; }
  .actions { display: flex; gap: 8px; }
  .actions .px { flex: 1; min-height: 42px; font-size: clamp(9px, 2.4vw, 12px); }
  .px.ghost { background: var(--sky); color: var(--ink); }
  .bigScore { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .bigScore strong { font: clamp(16px, 5vw, 24px)/1 var(--pixel); font-weight: normal; font-variant-numeric: tabular-nums; }
  #boardList {
    list-style: none; margin: 0; padding: 0;
    display: grid; align-content: start; gap: 2px;
    flex: 1 1 auto; min-height: 64px;
    overflow-y: auto;
    touch-action: pan-y;
    font-variant-numeric: tabular-nums;
  }
  #boardList li { display: grid; grid-template-columns: 2.4em 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 3px 4px; }
  #boardList li .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #boardList li .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, transparent); }
  #boardList li.me { background: var(--ink); color: var(--sky); }
  #boardList li.none { display: block; opacity: 0.6; }
  #entry { display: grid; gap: 8px; }
  #entry label { color: var(--warn); }
  .row { display: flex; gap: 8px; }
  #nameIn {
    flex: 1; min-width: 0;
    font: 16px/1 var(--pixel);
    text-transform: uppercase;
    padding: 8px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--sky); color: var(--ink);
    user-select: text; -webkit-user-select: text;
  }
  .px {
    font: clamp(8px, 2.2vw, 10px)/1 var(--pixel);
    letter-spacing: 0.08em;
    padding: 10px 12px;
    border: 2px solid var(--ink); border-radius: 2px;
    background: var(--ink); color: var(--sky);
    cursor: pointer;
  }
  .px:disabled { opacity: 0.5; cursor: default; }
  #saved { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .link { font: inherit; letter-spacing: inherit; background: none; border: 0; padding: 4px 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
  #boardNote { opacity: 0.7; flex: none; }
  .card button:focus-visible, #nameIn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-height: 430px) {
    #overlay { gap: 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 50px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px); }
    #ovHead { gap: 4px; }
    .card { padding: 8px 10px; gap: 7px; }
    #hangar, #result { gap: 7px; }
    #preview { height: 50px; }
    .picker .arrow { min-height: 32px; }
    .swatch { width: 26px; height: 26px; }
    .actions .px { min-height: 36px; }
  }

  .blink { animation: blink 0.25s steps(1) 4; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    #ovSub, .blink, #fuel.empty { animation: none; }
  }
</style>

<canvas id="game" aria-label="Skyline Glide: tap to climb, hold to keep climbing"></canvas>
<div id="hud"><span id="hi">HI 00000</span><span id="score">00000</span></div>
<button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path id="cross" d="M17 9l5 6M22 9l-5 6" style="display:none"/>
  </svg>
</button>
<div id="fuel" hidden><span id="fuelLabel">FUEL</span><div id="fuelBar"><div id="fuelFill"></div></div></div>
<div id="overlay">
  <div id="ovHead">
    <div id="ovTitle">SKYLINE GLIDE</div>
    <div id="ovSub">TAP ANYWHERE TO FLY · HOLD TO CLIMB</div>
    <div id="hint" hidden>Turn your phone sideways to see further ahead</div>
  </div>
  <section id="left" class="card" aria-label="Your plane">
    <div id="hangar">
      <div class="cardHead"><span>HANGAR</span><span id="planeName">AIRLINER</span></div>
      <canvas id="preview" aria-hidden="true"></canvas>
      <div class="picker" role="group" aria-label="Plane type">
        <button type="button" class="px ghost arrow" id="prevPlane" aria-label="Previous plane">&lt;</button>
        <div class="pick" aria-live="polite"><span id="pickName">AIRLINER</span><span id="pickStatus"></span></div>
        <button type="button" class="px ghost arrow" id="nextPlane" aria-label="Next plane">&gt;</button>
      </div>
      <div class="pips" id="pips" aria-hidden="true"></div>
      <div id="unlockHint"></div>
      <div class="swatches" id="swatches" role="group" aria-label="Livery colour"></div>
    </div>
    <div id="result" hidden>
      <div class="bigScore"><span>SCORE</span><strong id="finalScore">00000</strong></div>
      <div id="unlockMsg" hidden></div>
      <form id="entry" hidden>
        <label for="nameIn" id="entryLabel">NEW BEST! ENTER YOUR NAME</label>
        <div class="row">
          <input id="nameIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" placeholder="ACE">
          <button class="px" id="saveBtn" type="submit">SAVE</button>
        </div>
      </form>
      <div id="saved" hidden><span id="savedText"></span><button class="link" id="editName" type="button">EDIT NAME</button></div>
    </div>
    <div class="actions">
      <button class="px ghost" id="homeBtn" type="button" hidden>HOME</button>
      <button class="px" id="flyBtn" type="button">FLY</button>
    </div>
  </section>
  <section id="right" class="card" aria-label="Top pilots">
    <div class="cardHead"><span>TOP 10 PILOTS</span><span id="boardScope">THIS DEVICE</span></div>
    <ol id="boardList"></ol>
    <div id="boardNote" hidden></div>
  </section>
</div>

<script>
(() => {
  'use strict';

  // Optional: a free Supabase project makes the board global when this file is hosted
  // outside claude.ai (see README). Leave empty to use claude.ai's shared store or this device.
  // The publishable key is meant to be public; the table's row-level security rules protect the data.
  const SUPABASE_URL = 'https://nsymcgtlbelmtshkbsok.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_iWAvFavSpjydq7c_4CFV9A_pI6rrNH8';

  const $ = (id) => document.getElementById(id);
  const cv = $('game');
  const mainCtx = cv.getContext('2d');
  let ctx = mainCtx; // swapped briefly to draw the hangar preview
  const scoreEl = $('score'), hiEl = $('hi'), overlay = $('overlay'), ovTitle = $('ovTitle'),
        ovSub = $('ovSub'), hint = $('hint'), muteBtn = $('mute'),
        fuelEl = $('fuel'), fuelFill = $('fuelFill'), fuelLabel = $('fuelLabel');

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const pad = (n) => String(Math.min(n, 99999)).padStart(5, '0');
  function hash(a, b, c) {
    let h = Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35) ^ Math.imul(c + 0x27d4eb2f, 0x165667b1);
    h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
    h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
    return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  // ---------- palette (day ↔ night) ----------
  // sky/skyTop: the sky gradient; panel: menu cards; t*: tower faces; tside: shaded side; tv: flickering screens
  const DAY = { sky: '#e3f2f8', skyTop: '#a8d6ea', panel: '#f7f7f5', ground: '#ebe8df', ink: '#535353', mid: '#8c96a0',
                t0: '#eceef0', t1: '#e2e5e8', t2: '#d8dce0', tside: '#c9ced4', trim: '#9aa1a9', lobby: '#8d949c',
                glass: '#cfe3ee', win: '#9fb1c1', lit: '#9fb1c1', tv: '#9fb1c1', glint: '#f4fbff',
                cloud: '#ffffff', cloudShade: '#d6e5ee', body: '#ffffff', wing: '#dcdcda', steel: '#a7aeb6' };
  const NIGHT = { sky: '#262b3a', skyTop: '#10131a', panel: '#1d2029', ground: '#1a1c22', ink: '#d4d4d2', mid: '#7a7f8b',
                  t0: '#2b2f38', t1: '#31353f', t2: '#262a32', tside: '#1f232a', trim: '#474d58', lobby: '#1a1d23',
                  glass: '#f2d27a', win: '#3b404b', lit: '#f2d27a', tv: '#8fb8ff', glint: '#3b404b',
                  cloud: '#3a3f4b', cloudShade: '#2c3039', body: '#ecebe7', wing: '#a9aab0', steel: '#8d949d' };
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const DAYc = {}, NIGHTc = {};
  for (const key in DAY) { DAYc[key] = hexRgb(DAY[key]); NIGHTc[key] = hexRgb(NIGHT[key]); }
  const P = {};
  let lastMix = -1;
  function updatePalette(m) {
    if (Math.abs(m - lastMix) < 0.002) return;
    lastMix = m;
    for (const key in DAYc) {
      const a = DAYc[key], b = NIGHTc[key];
      P[key] = `rgb(${Math.round(a[0] + (b[0] - a[0]) * m)},${Math.round(a[1] + (b[1] - a[1]) * m)},${Math.round(a[2] + (b[2] - a[2]) * m)})`;
    }
    const root = document.documentElement.style;
    root.setProperty('--sky', P.panel);
    root.setProperty('--bg', P.sky);
    root.setProperty('--ink', P.ink);
  }
  const SUN = '#f4c24a', SUN_LINE = '#dca12a', MOON = '#ebe6d2', FLAME = '#f39a2b', FLAME_CORE = '#ffe08a';

  // ---------- world sizing ----------
  let cssW, cssH, dpr, S, W, H, groundY, playH, k, portrait, px;
  function resize() {
    cssW = window.innerWidth; cssH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
    portrait = cssW < cssH * 0.9;
    S = portrait ? cssW / 360 : Math.min(cssH / 380, cssW / 560);
    W = cssW / S; H = cssH / S;
    groundY = H - (portrait ? Math.max(44, H * 0.1) : 34);
    playH = groundY;
    k = playH / 340;
    px = clamp(W * 0.2, 70, 150);
    hint.hidden = !(portrait && state === 'ready');
    player.y = clamp(player.y || playH * 0.42, 18, groundY - 14);
  }

  // ---------- state ----------
  let state = 'ready', t = 0, elapsed = 0, speed = 0, dist = 0, score = 0, shownScore = -1;
  let hi = parseInt(store.get('skyline-glide-hi'), 10) || 0;
  const DAY_CYCLE = 500;
  let lastMilestone = 0, nightMix = 0, nightTarget = 0, nextToggle = DAY_CYCLE;
  let clusters = [], enemies = [], clouds = [], flocks = [], puffs = [], trail = [], stars = [];
  let spawnCursor = 0, enemyTimer = 0, flockTimer = 3, groundOff = 0, trailTimer = 0, overT = 0, lastHf = 0.35;
  const player = { y: 0, vy: 0, angle: 0 };
  const pointers = new Set();
  let keyHeld = false;
  const holding = () => pointers.size > 0 || keyHeld;
  const baseSpeed = () => (portrait ? 150 : 175);

  // Fuel: taps sip, holding burns; it refills while you're off the throttle.
  const FUEL = { tap: 0.045, burn: 0.42, regen: 0.3, relight: 0.25 };
  let fuel = 1, fuelOut = false, shownFuel = -1, shownFuelState = '';

  // ---------- towers ----------
  const SHAPES = ['block', 'stepped', 'spire', 'antenna', 'dome', 'slant', 'crown', 'block'];
  const ornUnit = (hB) => Math.min(22, hB * 0.15);
  const AWNINGS = ['#c96b4a', '#4a7fa8', '#5c9a6b', '#c9a14a', '#8a6bb0'];
  function makeCluster(x, diff) {
    const n = randi(2, 4);
    let hf = rand(0.2, 0.5 + 0.14 * diff);
    if (Math.abs(hf - lastHf) < 0.08) hf = clamp(hf + (hf > lastHf ? 0.1 : -0.1), 0.18, 0.64);
    lastHf = hf;
    const towers = [];
    let dx = 0;
    for (let i = 0; i < n; i++) {
      const w = randi(30, 54);
      const shape = pick(SHAPES);
      // flat roofs sometimes carry a water tank or a billboard beside the plant room
      const extra = shape === 'block' ? pick(['tank', 'billboard', 'none']) : 'none';
      towers.push({ dx, w, shape, extra, shade: randi(0, 2), o: rand(0.8, 1), seed: randi(1, 1e9), style: randi(0, 3),
                    awning: pick(AWNINGS), beacon: hf > 0.42 || Math.random() < 0.3 });
      dx += w + randi(0, 3);
    }
    return { x, hf, towers, width: dx };
  }

  function towerRects(tw, x, y0) {
    const w = tw.w, cx = x + w / 2, oH = ornUnit(groundY - y0) * tw.o;
    const r = [[x - 1.5, y0 - 1, w + 3, groundY - y0 + 1]];
    switch (tw.shape) {
      case 'block': r.push([x + w * 0.55, y0 - oH * 0.35, w * 0.28, oH * 0.35]); break;
      case 'stepped': r.push([x + w * 0.17, y0 - oH * 0.5, w * 0.66, oH * 0.5], [x + w * 0.32, y0 - oH, w * 0.36, oH * 0.5]); break;
      case 'spire': r.push([x + w * 0.3, y0 - oH * 0.4, w * 0.4, oH * 0.4], [cx - 2, y0 - oH * 1.5, 4, oH * 1.1]); break;
      case 'antenna': r.push([x + w * 0.35, y0 - 4, w * 0.3, 4], [cx - 2, y0 - oH * 1.6, 4, oH * 1.6]); break;
      case 'dome': { const rx = w * 0.38, ry = Math.min(oH, rx);
        r.push([cx - rx * 0.85, y0 - ry * 0.6, rx * 1.7, ry * 0.6], [cx - rx * 0.5, y0 - ry, rx, ry * 0.4]); break; }
      case 'slant': r.push([x, y0 - oH * 0.8, w * 0.3, oH * 0.8], [x, y0 - oH * 0.4, w * 0.65, oH * 0.4]); break;
      case 'crown': for (let m = 0; m < 3; m++) r.push([x + w * (0.08 + m * 0.32), y0 - oH * 0.4, w * 0.2, oH * 0.4]); break;
    }
    if (tw.extra === 'tank') r.push([x + w * 0.1, y0 - oH * 0.95, w * 0.28, oH * 0.95]);
    if (tw.extra === 'billboard') r.push([x + w * 0.06, y0 - oH * 1.05, w * 0.44, oH * 1.05]);
    return r;
  }

  // Windows: four facade styles. At night some flash on and off and a few flicker like TVs;
  // by day a sheen of reflected light sweeps across the glass.
  function drawWindows(tw, x, y0) {
    const w = tw.w, top = y0 + 7, bottom = groundY - 15;
    const night = nightMix > 0.05;
    const base = new Path2D(), lit = new Path2D(), tv = new Path2D(), glint = new Path2D();
    let cw = 3, ch = 3.6, gx = 5, gy = 6;
    if (tw.style === 1) { cw = 4.4; ch = 2.8; gx = 5; gy = 6.5; }       // ribbon glazing
    else if (tw.style === 2) { cw = 2.4; ch = 5.2; gx = 4.4; gy = 7.5; } // tall slits
    else if (tw.style === 3) { cw = 3.2; ch = 4.2; gx = 4.4; gy = 7; }   // paired windows
    const cols = Math.max(1, Math.floor((w - 6 + (gx - cw)) / gx));
    const sx = x + (w - (cols * gx - (gx - cw))) / 2;
    const sweep = (t * 38 + (tw.seed % 97)) % 220 - 30;
    for (let r = 0, yy = top; yy + ch < bottom; r++, yy += gy) {
      for (let c = 0; c < cols; c++) {
        if (tw.style === 3 && c % 3 === 2) continue;
        if (tw.style === 0 && hash(tw.seed, r, c) < 0.05) continue;
        let target = base;
        if (night) {
          const b = hash(tw.seed, r, c + 211);
          if (b < 0.06) target = ((t * 0.8 + b * 60) | 0) % 2 ? lit : base;                 // switching on and off
          else if (b < 0.09) target = hash(tw.seed, r, c + ((t * 6) | 0)) < 0.5 ? tv : lit; // TV flicker
          else if (hash(tw.seed, r, c + 97) < 0.45) target = lit;
        } else {
          const d = c * gx + r * gy * 0.55 - sweep;
          if (d > -3 && d < 5) target = glint;
          else if (hash(tw.seed, r, c + 13) < 0.06) target = glint;
        }
        target.rect(sx + c * gx, yy, tw.style === 3 && c % 3 === 0 ? cw + 0.8 : cw, ch);
      }
    }
    ctx.fillStyle = P.win; ctx.fill(base);
    ctx.fillStyle = P.glint; ctx.fill(glint);
    ctx.fillStyle = P.lit; ctx.fill(lit);
    ctx.fillStyle = P.tv; ctx.fill(tv);
    // spandrel bands on slit facades
    if (tw.style === 2) {
      ctx.fillStyle = P.tside;
      for (let yy = top - 1.5; yy < bottom; yy += gy * 3) ctx.fillRect(x + 2, yy, w - 4, 1);
    }
  }

  function drawTower(tw, x, y0) {
    const w = tw.w, cx = x + w / 2, hB = groundY - y0, oH = ornUnit(hB) * tw.o;
    const fill = P['t' + tw.shade];
    ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = P.ink; ctx.fillStyle = fill;

    // rooftop extras
    if (tw.extra === 'tank') {
      const tx = x + w * 0.1, tw2 = w * 0.28;
      ctx.beginPath();
      ctx.moveTo(tx + 2, y0); ctx.lineTo(tx + 2, y0 - oH * 0.4);
      ctx.moveTo(tx + tw2 - 2, y0); ctx.lineTo(tx + tw2 - 2, y0 - oH * 0.4);
      ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.rect(tx, y0 - oH * 0.8, tw2, oH * 0.4); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tx - 0.5, y0 - oH * 0.8); ctx.lineTo(tx + tw2 / 2, y0 - oH * 0.95); ctx.lineTo(tx + tw2 + 0.5, y0 - oH * 0.8); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.4;
    } else if (tw.extra === 'billboard') {
      const bx = x + w * 0.06, bw = w * 0.44, top = y0 - oH * 1.05, bh = oH * 0.6;
      ctx.beginPath(); ctx.moveTo(bx + bw * 0.25, y0); ctx.lineTo(bx + bw * 0.25, top + bh); ctx.moveTo(bx + bw * 0.75, y0); ctx.lineTo(bx + bw * 0.75, top + bh);
      ctx.lineWidth = 1; ctx.stroke(); ctx.lineWidth = 1.4;
      ctx.fillStyle = nightMix > 0.4 ? P.lit : P.glint;
      ctx.beginPath(); ctx.rect(bx, top, bw, bh); ctx.fill(); ctx.stroke();
      ctx.fillStyle = tw.awning; ctx.fillRect(bx + 2, top + bh * 0.3, bw * 0.55, bh * 0.4);
      ctx.fillStyle = P.trim; ctx.fillRect(bx + bw * 0.65, top + bh * 0.3, bw * 0.25, bh * 0.4);
      ctx.fillStyle = fill;
    }

    // rooftop ornament, drawn first so the body's roof edge sits over it
    ctx.beginPath();
    let beacon = null;
    switch (tw.shape) {
      case 'block': ctx.rect(x + w * 0.55, y0 - oH * 0.35, w * 0.28, oH * 0.35); break;
      case 'stepped': ctx.rect(x + w * 0.17, y0 - oH * 0.5, w * 0.66, oH * 0.5); ctx.rect(x + w * 0.32, y0 - oH, w * 0.36, oH * 0.5); beacon = [cx, y0 - oH]; break;
      case 'spire':
        ctx.moveTo(x + w * 0.2, y0); ctx.lineTo(cx, y0 - oH * 0.8); ctx.lineTo(x + w * 0.8, y0); ctx.closePath();
        beacon = [cx, y0 - oH * 1.5]; break;
      case 'antenna': ctx.rect(x + w * 0.35, y0 - 4, w * 0.3, 4); beacon = [cx, y0 - oH * 1.6]; break;
      case 'dome': { const rx = w * 0.38, ry = Math.min(oH, rx);
        ctx.ellipse(cx, y0, rx, ry, 0, Math.PI, TAU); ctx.closePath(); beacon = [cx, y0 - ry - 5]; break; }
      case 'slant': ctx.moveTo(x, y0); ctx.lineTo(x, y0 - oH * 0.8); ctx.lineTo(x + w, y0); ctx.closePath(); beacon = [x + 1, y0 - oH * 0.8]; break;
      case 'crown': for (let m = 0; m < 3; m++) ctx.rect(x + w * (0.08 + m * 0.32), y0 - oH * 0.4, w * 0.2, oH * 0.4); break;
    }
    ctx.fill(); ctx.stroke();
    if (tw.shape === 'spire') { ctx.beginPath(); ctx.moveTo(cx, y0 - oH * 0.8); ctx.lineTo(cx, y0 - oH * 1.5); ctx.stroke(); }
    if (tw.shape === 'dome') {
      const ry = Math.min(oH, w * 0.38);
      ctx.beginPath(); ctx.moveTo(cx, y0 - ry); ctx.lineTo(cx, y0 - ry - 5); ctx.stroke();
      // dome ribs
      ctx.beginPath(); ctx.ellipse(cx, y0, w * 0.18, ry, 0, Math.PI, TAU); ctx.lineWidth = 0.7; ctx.stroke(); ctx.lineWidth = 1.4;
    }
    if (tw.shape === 'antenna') {
      ctx.beginPath(); ctx.moveTo(cx, y0 - 4); ctx.lineTo(cx, y0 - oH * 1.6);
      ctx.moveTo(cx - 4, y0 - oH * 1.1); ctx.lineTo(cx + 4, y0 - oH * 1.1);
      ctx.moveTo(cx - 2.5, y0 - oH * 1.35); ctx.lineTo(cx + 2.5, y0 - oH * 1.35); ctx.stroke();
    }
    if (tw.shape === 'block' || tw.shape === 'crown') {
      // plant-room louvres and a roof railing
      if (tw.shape === 'block') { ctx.fillStyle = P.tside; for (let i = 1; i < 4; i++) ctx.fillRect(x + w * 0.58, y0 - oH * 0.35 + i * oH * 0.08, w * 0.22, 0.7); }
      ctx.beginPath(); ctx.moveTo(x + 1, y0 - 3); ctx.lineTo(x + w - 1, y0 - 3); ctx.lineWidth = 0.6; ctx.stroke(); ctx.lineWidth = 1.4;
    }

    // body with a shaded side for depth
    ctx.fillStyle = fill; ctx.fillRect(x, y0, w, hB);
    ctx.fillStyle = P.tside; ctx.fillRect(x + w * 0.82, y0, w * 0.18, hB);
    drawWindows(tw, x, y0);
    // corner pilasters
    ctx.fillStyle = P.tside; ctx.fillRect(x, y0, 1.6, hB);
    ctx.strokeStyle = P.ink; ctx.beginPath(); ctx.rect(x, y0, w, hB); ctx.stroke();
    // cornice
    ctx.fillStyle = P.trim; ctx.beginPath(); ctx.rect(x - 1.5, y0 - 1, w + 3, 3); ctx.fill(); ctx.lineWidth = 0.9; ctx.stroke();

    // lobby: dark base, glass doors, awning
    const lh = 11;
    ctx.fillStyle = P.lobby; ctx.fillRect(x + 0.7, groundY - lh, w - 1.4, lh);
    ctx.fillStyle = P.glass;
    ctx.fillRect(cx - 4.5, groundY - 7.5, 4, 7.5); ctx.fillRect(cx + 0.5, groundY - 7.5, 4, 7.5);
    for (let lx = x + 3; lx < cx - 7; lx += 5) ctx.fillRect(lx, groundY - 8, 3, 5);
    for (let lx = cx + 7; lx < x + w - 5; lx += 5) ctx.fillRect(lx, groundY - 8, 3, 5);
    ctx.fillStyle = tw.awning;
    ctx.beginPath(); ctx.moveTo(cx - 8, groundY - lh); ctx.lineTo(cx + 8, groundY - lh); ctx.lineTo(cx + 9.5, groundY - lh + 3.5); ctx.lineTo(cx - 9.5, groundY - lh + 3.5); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 0.9; ctx.stroke(); ctx.lineWidth = 1.4;

    // aviation beacon: a red double-flash, day and night
    if (tw.beacon) {
      const [bx, by] = beacon || [x + w - 3, y0 - 1];
      const ph = (t * 0.9 + (tw.seed % 10) / 10) % 1;
      if (ph < 0.08 || (ph > 0.16 && ph < 0.24)) {
        ctx.fillStyle = 'rgba(240,70,50,0.35)'; ctx.beginPath(); ctx.arc(bx, by, 4, 0, TAU); ctx.fill();
        ctx.fillStyle = '#f04632'; ctx.beginPath(); ctx.arc(bx, by, 1.8, 0, TAU); ctx.fill();
      } else {
        ctx.fillStyle = '#a3372a'; ctx.beginPath(); ctx.arc(bx, by, 1.2, 0, TAU); ctx.fill();
      }
    }
  }

  // ---------- aircraft ----------
  // Every model is drawn facing right in local units (y down); oncoming traffic is mirrored.
  function navLights(tailX, tailY, tipX, tipY, seed) {
    if (nightMix > 0.3 && Math.sin(t * 6 + seed) > 0.3) {
      ctx.fillStyle = '#e0412f'; ctx.beginPath(); ctx.arc(tailX, tailY, 1.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#5ee08a'; ctx.beginPath(); ctx.arc(tipX, tipY, 1.2, 0, TAU); ctx.fill();
    }
  }
  function propDisc(x, y, r, speed) {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = P.mid;
    ctx.beginPath(); ctx.ellipse(x, y, 1.1, Math.abs(Math.sin(t * speed)) * r + 0.6, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(x, y, 1.1, 0, TAU); ctx.fill();
  }

  // Draws an aircraft at the current transform. liv null draws a locked silhouette.
  function drawCraft(sh, liv, gear, sc) {
    const sil = !liv;
    const lw = 0.9 / sc;
    const SIL = 'rgba(96,104,116,0.35)';
    const col = (c) => (sil ? SIL : c);
    const dark = sil ? SIL : darken(liv, 0.72);
    const OUT = sil ? 'rgba(0,0,0,0)' : PC.out;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = OUT;
    const part = (path, fill) => { ctx.fillStyle = fill; ctx.fill(path); ctx.stroke(path); };
    const rr = (x, y, w, h) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, h / 2); else ctx.rect(x, y, w, h); };
    const lines = (list, color, width) => {
      ctx.strokeStyle = col(color); ctx.lineWidth = width;
      ctx.beginPath(); for (const [a, b, c, d] of list) { ctx.moveTo(a, b); ctx.lineTo(c, d); } ctx.stroke();
      ctx.strokeStyle = OUT; ctx.lineWidth = lw;
    };
    const wheel = (x, y, r) => { ctx.fillStyle = col(PC.tyre); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };

    if (gear && sh.gear) for (const [gx, gy] of sh.gear) { ctx.fillStyle = col(PC.win); ctx.fillRect(gx - 0.45, gy, 0.9, 5.5); wheel(gx, gy + 6.4, 1.9); }
    if (sh.fixedGear) for (const [gx, gy, len] of sh.fixedGear) {
      if (len > 2) { lines([[gx - 1.5, gy, gx, gy + len], [gx + 1.5, gy, gx, gy + len]], PC.win, 0.8); wheel(gx, gy + len + 0.5, 2.2); }
      else wheel(gx, gy + len, 1.2);
    }
    if (sh.farWing) part(sh.farWing, col(PC.wing));
    if (sh.antenna && !sil) lines([sh.antenna], PC.win, lw);
    part(sh.fin, col(liv));
    if (sh.finEdge && !sil) { ctx.fillStyle = dark; ctx.fill(sh.finEdge); }
    if (sh.lowerFin) part(sh.lowerFin, col(liv));
    if (sh.under) part(sh.under, col(PC.white));
    if (sh.floatStruts) lines(sh.floatStruts, PC.win, 0.8);
    if (sh.floats) {
      part(sh.floats, col(PC.white));
      if (!sil) { ctx.save(); ctx.clip(sh.floats); ctx.fillStyle = liv; ctx.fillRect(-20, 9, 40, 2); ctx.restore(); ctx.stroke(sh.floats); }
    }
    if (sh.rearEngines) for (const [x, y, w, h] of sh.rearEngines) {
      rr(x, y, w, h); ctx.fillStyle = col(liv); ctx.fill(); ctx.stroke();
      if (!sil) { ctx.fillStyle = dark; ctx.fillRect(x + w - 1.1, y + 0.7, 1, h - 1.4); }
    }

    // fuselage with lower shading, belly stripe and details
    const bodyFill = sh.bodyFill === 'liv' ? liv : sh.military ? PC.steel : PC.white;
    part(sh.body, col(bodyFill));
    if (!sil) {
      ctx.save(); ctx.clip(sh.body);
      ctx.fillStyle = sh.bodyFill === 'liv' ? PC.wing : sh.military ? PC.steelShade : PC.shade; ctx.fillRect(-40, sh.shadeY, 80, 20);
      if (sh.bellyY != null) { ctx.fillStyle = liv; ctx.fillRect(-40, sh.bellyY, 80, 20); }
      if (sh.band) { ctx.fillStyle = liv; ctx.fillRect(-40, sh.band[0], 80, sh.band[1] - sh.band[0]); }
      ctx.restore();
      ctx.stroke(sh.body);
      ctx.fillStyle = PC.win;
      for (const wr of sh.windows || []) for (let x = wr.x0; x <= wr.x1; x += wr.step) ctx.fillRect(x, wr.y, wr.w, wr.h);
      if (sh.ovals) for (let x = sh.ovals.x0; x <= sh.ovals.x1; x += sh.ovals.step) { ctx.beginPath(); ctx.ellipse(x, sh.ovals.y, 0.9, 1.15, 0, 0, TAU); ctx.fill(); }
      for (const g of sh.glass || []) { ctx.fillStyle = PC.cockpit; ctx.fill(g); }
      ctx.strokeStyle = liv; ctx.lineWidth = 0.75;
      for (const [x, y, w, h] of sh.doors || []) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, 0.8); else ctx.rect(x, y, w, h); ctx.stroke(); }
      ctx.lineWidth = lw; ctx.strokeStyle = OUT;
      if (sh.cockpit) { ctx.fillStyle = PC.cockpit; ctx.fill(sh.cockpit); }
      if (sh.canopy) { ctx.fillStyle = PC.cockpit; ctx.fill(sh.canopy); }
      if (sh.military) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(9, -4.6, 2.6, 0.7, -0.2, 0, TAU); ctx.fill();
        ctx.fillStyle = liv; ctx.fillRect(-12, -0.4, 16, 1.3);
        ctx.fillStyle = PC.win; ctx.fillRect(-1, -1.2, 6, 2.6);
      }
      if (sh.roundel) {
        const [x, y, r] = sh.roundel;
        ctx.fillStyle = PC.white; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, TAU); ctx.fill();
      }
    }
    if (sh.tailplane) part(sh.tailplane, col(PC.wing));
    if (sh.highWing) part(sh.highWing, col(PC.wing));
    if (sh.wing) {
      const wf = sh.wingFill === 'liv' ? liv : sh.military ? PC.steelShade : sh.bodyFill === 'liv' ? dark : PC.wingShade;
      part(sh.wing, col(wf));
      if (!sil && sh.wingTop) { ctx.fillStyle = sh.military ? PC.steel : sh.bodyFill === 'liv' ? liv : PC.wing; ctx.fill(sh.wingTop); }
      if (!sil && sh.military) { ctx.fillStyle = liv; ctx.fillRect(-10, 2.3, 6, 1.3); }
    }
    for (const [x, y, w, h] of (sh.engines || []).concat(sh.nacelles || [])) {
      rr(x, y, w, h); ctx.fillStyle = col(liv); ctx.fill(); ctx.stroke();
      if (!sil) { ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(x + 2, y + 0.8, w - 4, 0.9); ctx.fillStyle = dark; ctx.fillRect(x + w - 1.2, y + 0.7, 1, h - 1.4); }
    }
    if (sh.cowl) part(sh.cowl, col(PC.steel));
    if (!sil) for (const [x, y, r] of (sh.props || []).concat(sh.noseProp ? [sh.noseProp] : [])) propDisc(x, y, r, 34);
    if (sh.spinner) part(sh.spinner, col(liv));
    if (sh.upperWing) { if (sh.struts) lines(sh.struts, PC.win, 0.8); part(sh.upperWing, col(liv)); }
    else if (sh.struts) lines(sh.struts, PC.wingShade, 0.9);
    if (sh.skids) lines(sh.skids, PC.win, 1);
    if (sh.rotor) {
      const [x, y, span] = sh.rotor;
      lines([[x, y + 2.8, x, y]], PC.win, 1);
      if (!sil) {
        const k2 = Math.abs(Math.cos(t * 22));
        ctx.fillStyle = 'rgba(80,88,100,0.18)'; ctx.beginPath(); ctx.ellipse(x, y, span, 1.2, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = PC.win; ctx.fillRect(x - span * k2, y - 0.5, span * 2 * k2, 1);
      }
      if (sh.tailRotor && !sil) propDisc(sh.tailRotor[0], sh.tailRotor[1], sh.tailRotor[2], 40);
    }
    if (sh.military && !sil) {
      const fl = 7 + Math.sin(t * 40) * 2.5;
      ctx.fillStyle = FLAME; ctx.beginPath(); ctx.moveTo(-20, -2.3); ctx.lineTo(-20 - fl, 0); ctx.lineTo(-20, 2.3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = FLAME_CORE; ctx.beginPath(); ctx.moveTo(-20, -1.2); ctx.lineTo(-20 - fl * 0.55, 0); ctx.lineTo(-20, 1.2); ctx.closePath(); ctx.fill();
    }
  }

  function modelPoly(m, x, y, ang, flip, sc) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return m.hit.map(([lx, ly]) => {
      const a = lx * flip * sc, b = ly * sc;
      return [x + a * c - b * s, y + a * s + b * c];
    });
  }

  // ---------- collision helpers ----------
  function segRect(x1, y1, x2, y2, r) {
    let t0 = 0, t1 = 1;
    const dx = x2 - x1, dy = y2 - y1;
    const p = [-dx, dx, -dy, dy];
    const q = [x1 - r[0], r[0] + r[2] - x1, y1 - r[1], r[1] + r[3] - y1];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; continue; }
      const tt = q[i] / p[i];
      if (p[i] < 0) { if (tt > t1) return false; if (tt > t0) t0 = tt; }
      else { if (tt < t0) return false; if (tt < t1) t1 = tt; }
    }
    return true;
  }
  const orient = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
  const segSeg = (a, b, c, d) => orient(a, b, c) * orient(a, b, d) < 0 && orient(c, d, a) * orient(c, d, b) < 0;
  function polyHitsRect(poly, r) {
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      if (segRect(a[0], a[1], b[0], b[1], r)) return true;
    }
    return false;
  }
  function polyHitsPoly(A, B) {
    for (let i = 0; i < A.length; i++) {
      const a = A[i], b = A[(i + 1) % A.length];
      for (let j = 0; j < B.length; j++) if (segSeg(a, b, B[j], B[(j + 1) % B.length])) return true;
    }
    return false;
  }

  // ---------- scenery ----------
  function makeCloud(x, near) {
    const wv = rand(44, 80);
    const n = randi(4, 6);
    const blobs = [];
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1), arch = Math.sin(f * Math.PI);
      const r = (0.55 + arch * 0.75) * rand(8.5, 11);
      blobs.push({ x: -wv / 2 + f * wv, y: -r * 0.45 - arch * 4, r });
    }
    return { x, y: rand(playH * 0.08, playH * (near ? 0.5 : 0.4)), s: near ? rand(0.95, 1.35) : rand(0.55, 0.8), near, blobs, wv };
  }
  // Solid two-tone clouds: puffs on a rounded base, a shaded underside, flat along the bottom.
  function cloudPath(c, dy) {
    ctx.beginPath();
    for (const b of c.blobs) { ctx.moveTo(b.x + b.r, b.y + dy); ctx.arc(b.x, b.y + dy, b.r, 0, TAU); }
    const h = 10;
    if (ctx.roundRect) ctx.roundRect(-c.wv / 2 - 4, -h + dy, c.wv + 8, h + 6, h / 2); else ctx.rect(-c.wv / 2 - 4, -h + dy, c.wv + 8, h + 6);
  }
  function drawCloud(c) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    if (!c.near) ctx.globalAlpha = 0.85;

    enemies = enemies.filter((e) => e.x > -80);
    enemyTimer -= dt;
    if (enemyTimer <= 0 && elapsed > 3) trySpawnEnemy(diff);

    trailTimer -= dt;
    if (trailTimer <= 0 && !fuelOut) {
      trailTimer = 0.04;
      const c = Math.cos(player.angle), s = Math.sin(player.angle);
      trail.push({ x: px - c - 8 * s, y: player.y - s + 8 * c, a: 0.6 });
    }

    if (score >= lastMilestone + 100) { lastMilestone = Math.floor(score / 100) * 100; blinkScore(); sfx.point(); }
    if (score >= nextToggle) { nightTarget = 1 - nightTarget; nextToggle += DAY_CYCLE; }

    // collisions
    const sh = playerShape();
    const poly = modelPoly(sh, px, player.y, player.angle, 1, sh.sc);
    for (const p of poly) if (p[1] >= groundY) return crash();
    for (const c of clusters) {
      if (c.x > px + 50 || c.x + c.width < px - 50) continue;
      const y0 = groundY - c.hf * playH;
      for (const tw of c.towers) for (const r of towerRects(tw, c.x + tw.dx, y0)) if (polyHitsRect(poly, r)) return crash();
    }
    for (const e of enemies) {
      if (Math.abs(e.x - px) > 75 || Math.abs(e.y - player.y) > 45) continue;
      if (polyHitsPoly(poly, modelPoly(e.m, e.x, e.y, 0, -1, e.sc))) return crash();
    }
  }

  function blinkScore() {
    scoreEl.classList.remove('blink');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('blink');
  }

  function renderFuel() {
    const f = Math.round(fuel * 100) / 100;
    if (f !== shownFuel) { shownFuel = f; fuelFill.style.transform = `scaleX(${f})`; }
    const st = fuelOut ? 'empty' : fuel < 0.3 ? 'low' : '';
    if (st !== shownFuelState) {
      shownFuelState = st;
      fuelEl.className = st === 'empty' ? 'low empty' : st;
      fuelLabel.textContent = fuelOut ? 'NO FUEL' : 'FUEL';
    }
  }

  function draw() {
    ctx.setTransform(S * dpr, 0, 0, S * dpr, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, groundY);
    sky.addColorStop(0, P.skyTop); sky.addColorStop(1, P.sky);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, groundY);

    if (nightMix > 0.01) {
      ctx.fillStyle = P.ink;
      for (const s of stars) {
        ctx.globalAlpha = nightMix * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
        ctx.fillRect(s.x * W, s.y * playH * 0.7, s.r, s.r);
      }
      ctx.globalAlpha = 1;
    }

    const sx = W * 0.8, sy = Math.max(42, playH * 0.17), sr = 17;
    if (nightMix < 0.99) {
      ctx.globalAlpha = 1 - nightMix;
      ctx.strokeStyle = SUN_LINE; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * TAU + t * 0.15;
        ctx.moveTo(sx + Math.cos(a) * (sr + 5), sy + Math.sin(a) * (sr + 5));
        ctx.lineTo(sx + Math.cos(a) * (sr + 10), sy + Math.sin(a) * (sr + 10));
      }
      ctx.stroke();
      ctx.fillStyle = SUN; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
      ctx.lineWidth = 1.4; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (nightMix > 0.01) {
      ctx.globalAlpha = nightMix;
      // crescent: the moon disc clipped away where a second disc overlaps it
      ctx.save();
      ctx.beginPath(); ctx.rect(sx - 30, sy - 30, 60, 60); ctx.arc(sx + 7, sy - 4, sr - 4, 0, TAU, true); ctx.clip();
      ctx.fillStyle = MOON; ctx.beginPath(); ctx.arc(sx, sy, sr - 2, 0, TAU); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    for (const c of clouds) if (!c.near) drawCloud(c);
    for (const f of flocks) drawFlock(f);
    for (const c of clouds) if (c.near) drawCloud(c);

    for (const c of clusters) {
      if (c.x > W + 10 || c.x + c.width < -10) continue;
      const y0 = groundY - c.hf * playH;
      for (const tw of c.towers) drawTower(tw, c.x + tw.dx, y0);
    }

    for (const e of enemies) {
      if (e.x - 35 > W) {
        // incoming warning at the right edge
        if (Math.sin(t * 18) > -0.2) {
          ctx.fillStyle = '#d0503c';
          ctx.beginPath(); ctx.moveTo(W - 6, e.y - 7); ctx.lineTo(W - 16, e.y); ctx.lineTo(W - 6, e.y + 7); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(W - 15, e.y - 7); ctx.lineTo(W - 25, e.y); ctx.lineTo(W - 15, e.y + 7); ctx.closePath(); ctx.fill();
        }
        continue;
      }
      drawCraftAt(e.m, e.x, e.y, 0, -1, e.sc, e.liv, false);
    }

    ctx.fillStyle = P.mid;
    for (const s of trail) { ctx.globalAlpha = s.a; ctx.fillRect(s.x - 1, s.y - 1, 2, 2); }
    ctx.globalAlpha = 1;
    drawCraftAt(playerShape(), px, player.y, player.angle, 1, playerShape().sc, choice.color.c, false);

    for (const p of puffs) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = P.body; ctx.strokeStyle = P.ink; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = P.ground; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = P.ink; ctx.lineWidth = 1.4; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.fillStyle = P.ink;
    for (let off = -(groundOff % GROUND_TILE); off < W; off += GROUND_TILE) {
      for (const p of pebbles) ctx.fillRect(off + p.x, groundY + p.y, p.w, 1.3);
      ctx.beginPath();
      for (const b of bumps) { ctx.moveTo(off + b.x, groundY); ctx.lineTo(off + b.x + 3, groundY - 2); ctx.lineTo(off + b.x + b.w - 3, groundY - 2); ctx.lineTo(off + b.x + b.w, groundY); }
      ctx.stroke();
    }

    if (score !== shownScore) { shownScore = score; scoreEl.textContent = pad(score); }
    if (state === 'playing') renderFuel();
  }

  // ---------- input ----------
  // Taps on the menu cards stay with the cards; a tap anywhere else flies.
  const isUi = (e) => e.target && e.target.closest && e.target.closest('#mute, .card');
  window.addEventListener('pointerdown', (e) => {
    if (isUi(e)) return;
    e.preventDefault();
    if (document.activeElement === nameIn) nameIn.blur();
    pointers.add(e.pointerId);
    press();
  }, { passive: false });
  const release = (e) => pointers.delete(e.pointerId);
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('touchstart', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', (e) => { if (!isUi(e)) e.preventDefault(); }, { passive: false });
  window.addEventListener('contextmenu', (e) => { if (!isUi(e)) e.preventDefault(); });
  const isFlyKey = (e) => e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW';
  window.addEventListener('keydown', (e) => {
    if (!isFlyKey(e) || (e.target && e.target.closest && e.target.closest('input, button'))) return;
    e.preventDefault();
    if (!e.repeat) { keyHeld = true; press(); }
  });
  window.addEventListener('keyup', (e) => { if (isFlyKey(e)) keyHeld = false; });
  window.addEventListener('blur', () => { pointers.clear(); keyHeld = false; });
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    store.set('skyline-glide-muted', muted ? '1' : '0');
    renderMute();
    if (!muted) audio();
  });

  // ---------- loop ----------
  let last = performance.now();
  document.addEventListener('visibilitychange', () => { last = performance.now(); pointers.clear(); keyHeld = false; });
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    if (!overlay.hidden && !hangarEl.hidden) drawPreview();
    requestAnimationFrame(frame);
  }

  updatePalette(0);
  resize();
  initScenery();
  showHome();
  renderMute();
  hiEl.textContent = 'HI ' + pad(hi);
  window.addEventListener('resize', resize);
  initBoard();
  requestAnimationFrame(frame);
})();
</script>
